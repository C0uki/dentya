<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デン鉄 -DENTYA- 日本一周すごろく</title>

<style>
:root{
  --sea:#8FCFE3; --sea-deep:#6FB9D6; --land:#F4ECD6; --ink:#2A2E3A;
  --panel:#FFFDF6; --paper:#FFF8E8; --accent:#D94F3D; --gold:#F2B33D;
  --green:#2E9E63; --blue:#3E7BC0; --purple:#8E5AC8; --line:#5A5F6E;
  --shadow:0 4px 14px rgba(42,46,58,.22);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
  color:var(--ink); background:var(--sea); overflow:hidden;
  font-variant-numeric:tabular-nums;
}
button{font-family:inherit; cursor:pointer; border:none; color:inherit;}
button:focus-visible{outline:3px solid var(--blue); outline-offset:2px;}
#app{display:grid; grid-template-columns:1fr 268px; height:100dvh;}
@media (max-width:820px){
  #app{grid-template-columns:1fr; grid-template-rows:62% 38%;}
}
/* ---------- map ---------- */
#mapwrap{position:relative; overflow:hidden; background:
  linear-gradient(180deg, #C8E9F4 0%, #A9DCEC 16%, var(--sea) 46%, var(--sea-deep) 100%);}
#map{width:100%; height:100%; display:block;}
.edge{stroke:var(--line); stroke-width:3.4; fill:none; opacity:.75;}
.edge.sea{stroke-dasharray:2 7; stroke-linecap:round; stroke:#3F7E9C; opacity:.8;}
.landblob{stroke:#DECFA8; fill:var(--land); stroke-linejoin:round; stroke-linecap:round; opacity:.97;}
.landside{stroke:#C2AF83; fill:#C2AF83; stroke-linejoin:round; stroke-linecap:round; opacity:.95;}
.sq{stroke:#fff; stroke-width:2.2;}
.sq.blue{fill:var(--blue);} .sq.red{fill:var(--accent);} .sq.card{fill:var(--gold);}
.sq.lotto{fill:var(--purple);} .sq.warp{fill:#25AFA5;}
.sqside{stroke:none;}
.sqside.blue{fill:#28527F;} .sqside.red{fill:#94382C;} .sqside.card{fill:#A87E22;}
.sqside.lotto{fill:#603E8B;} .sqside.warp{fill:#177A72;}
.citypill-side{fill:#B9AC89; stroke:var(--ink); stroke-width:2;}
.sqlabel{fill:#fff; font-size:9px; font-weight:800; text-anchor:middle; pointer-events:none;}
.citypill{fill:var(--panel); stroke:var(--ink); stroke-width:2; rx:6;}
.cityname{font-size:10.5px; font-weight:800; text-anchor:middle; fill:var(--ink); pointer-events:none;}
.citytick{fill:var(--ink);}
.owndot{stroke:#fff; stroke-width:1;}
.opt-hit{fill:transparent; cursor:pointer;}
.opt-ring{fill:none; stroke:#fff; stroke-width:3; pointer-events:none; animation:pulse 1s infinite;}
.opt-ring.rec{stroke:var(--accent);}
.opt-lbl{font-size:11px; font-weight:800; fill:#fff; text-anchor:middle; pointer-events:none;
  paint-order:stroke; stroke:var(--ink); stroke-width:3px;}
.opt-lbl.rec{fill:#FFD34D;}
.turnmark{fill:#FFD34D; stroke:var(--ink); stroke-width:1.6; animation:bob .7s infinite alternate ease-in-out;}
@keyframes bob{from{transform:translateY(0);}to{transform:translateY(-6px);}}
@media (prefers-reduced-motion:reduce){ .turnmark{animation:none;} }
#destarrow{position:absolute; transform:translate(-50%,-50%); background:var(--accent); color:#fff;
  font-weight:800; font-size:12.5px; padding:6px 12px; border-radius:999px; display:flex; gap:7px;
  align-items:center; box-shadow:var(--shadow); pointer-events:none; z-index:4; white-space:nowrap;}
#destarrowdir{display:inline-block; font-size:14px;}
.dest-ring{fill:none; stroke:var(--accent); stroke-width:4; animation:pulse 1.4s infinite; pointer-events:none;}
.dest-flag{font-size:13px; font-weight:800; fill:var(--accent); text-anchor:middle; pointer-events:none;}
@keyframes pulse{0%{opacity:1; stroke-width:4;}50%{opacity:.35; stroke-width:7;}100%{opacity:1; stroke-width:4;}}
@media (prefers-reduced-motion:reduce){ .opt-ring,.dest-ring{animation:none;} }
.token{stroke:#fff; stroke-width:2.4; filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));}
.tokentxt{fill:#fff; font-size:11px; font-weight:800; text-anchor:middle; pointer-events:none;}
.bonbadge{fill:#4A3070; stroke:#fff; stroke-width:1.6;}
.bonbadgetxt{fill:#fff; font-size:10px; font-weight:800; text-anchor:middle; pointer-events:none;}
/* ---------- HUD ---------- */
#hud{position:absolute; top:10px; left:10px; right:10px; display:flex; gap:8px; align-items:flex-start; pointer-events:none; flex-wrap:wrap;}
.hudcard{background:var(--panel); border:2px solid var(--ink); border-radius:10px; padding:7px 12px; box-shadow:var(--shadow); pointer-events:auto;}
#huddate{font-weight:800; font-size:17px; letter-spacing:.04em;}
#huddest{font-weight:800;}
#huddest .to{color:var(--accent);}
#huddest small{display:block; font-weight:700; color:#6b6f7c; font-size:11px;}
#hudbtns{margin-left:auto; display:flex; gap:6px;}
.hudbtn{background:var(--ink); color:#fff; border-radius:8px; padding:7px 12px; font-weight:800; font-size:13px; box-shadow:var(--shadow); pointer-events:auto;}
.hudbtn[aria-pressed="true"]{background:var(--blue);}
#banner{position:absolute; top:66px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
  padding:8px 22px; border-radius:999px; font-weight:800; font-size:15px; letter-spacing:.06em;
  box-shadow:var(--shadow); opacity:0; transition:opacity .25s; pointer-events:none; max-width:88%; text-align:center; z-index:5;}
#banner.show{opacity:1;}
#banner.warn{background:var(--accent);}
#banner.good{background:var(--green);}
/* ---------- dock ---------- */
#dock{position:absolute; left:10px; right:10px; bottom:10px; display:flex; gap:10px; align-items:flex-end; pointer-events:none;}
#dockmain{background:var(--panel); border:2.5px solid var(--ink); border-radius:14px; padding:10px 14px;
  display:flex; gap:14px; align-items:center; box-shadow:var(--shadow); pointer-events:auto; flex-wrap:wrap; max-width:100%;}
#whoami{display:flex; flex-direction:column; gap:2px; min-width:120px;}
#whoname{font-weight:800; font-size:15px; display:flex; align-items:center; gap:6px;}
.chipdot{width:13px; height:13px; border-radius:50%; display:inline-block; border:2px solid #fff; box-shadow:0 0 0 1.5px var(--ink);}
#whocash{font-weight:800; font-size:14px;}
#whocash.minus{color:var(--accent);}
#dicebtn{background:var(--accent); color:#fff; font-size:17px; font-weight:800; border-radius:12px; padding:13px 26px;
  letter-spacing:.1em; box-shadow:0 4px 0 #A33327; transition:transform .06s;}
#dicebtn:active{transform:translateY(3px); box-shadow:0 1px 0 #A33327;}
#dicebtn:disabled{background:#B9BDC7; box-shadow:0 4px 0 #8f939d; cursor:default;}
#diceview{display:flex; gap:6px; min-height:44px; align-items:center;}
.die{width:44px; height:44px; perspective:280px;}
.die .cube{width:100%; height:100%; position:relative; transform-style:preserve-3d;
  transition:transform .65s cubic-bezier(.2,.7,.3,1.15);}
.die .f{position:absolute; inset:0; background:#fff; border:2.5px solid var(--ink); border-radius:9px;
  display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; backface-visibility:hidden;}
.die .f1{transform:rotateY(0deg) translateZ(22px);}
.die .f2{transform:rotateY(90deg) translateZ(22px);}
.die .f3{transform:rotateY(180deg) translateZ(22px);}
.die .f4{transform:rotateY(-90deg) translateZ(22px);}
.die .f5{transform:rotateX(90deg) translateZ(22px);}
.die .f6{transform:rotateX(-90deg) translateZ(22px);}
@media (prefers-reduced-motion:reduce){ .die .cube{transition:none;} }
#hand{display:flex; gap:6px; flex-wrap:wrap; max-width:430px;}
.cardchip{background:var(--paper); border:2px solid var(--gold); border-radius:8px; padding:5px 9px;
  font-size:12px; font-weight:800; line-height:1.25; text-align:left;}
.cardchip small{display:block; font-weight:700; color:#7a6c45; font-size:10px;}
.cardchip.passive{border-color:#9aa; opacity:.85; cursor:default;}
.cardchip:not(.passive):hover{background:#FFEFC2;}
#assetsbtn{background:var(--green); color:#fff; border-radius:8px; padding:8px 12px; font-weight:800; font-size:13px;}
/* ---------- side ---------- */
#side{background:var(--paper); border-left:3px solid var(--ink); display:flex; flex-direction:column; min-height:0;}
@media (max-width:820px){ #side{border-left:none; border-top:3px solid var(--ink);} }
#side h2{font-size:12px; letter-spacing:.22em; padding:9px 12px 5px; color:#7a6c45;}
#ranking{padding:0 8px 8px; display:flex; flex-direction:column; gap:5px;}
.prow{background:var(--panel); border:2px solid var(--ink); border-radius:9px; padding:6px 9px; display:grid;
  grid-template-columns:auto 1fr auto; gap:2px 8px; align-items:center; font-size:12px;}
.prow.active{outline:3px solid var(--gold);}
.prow .rk{font-weight:800; font-size:15px; grid-row:span 2;}
.prow .nm{font-weight:800; font-size:13px; display:flex; gap:5px; align-items:center;}
.prow .total{font-weight:800; grid-row:span 2; text-align:right;}
.prow .sub{color:#6b6f7c; font-size:11px; font-weight:700;}
.bontag{background:#4A3070; color:#fff; border-radius:5px; font-size:10px; padding:1px 5px; font-weight:800;}
.bontag.king{background:#1c1030; border:1px solid var(--gold); color:var(--gold);}
#log{flex:1; overflow-y:auto; padding:4px 12px 12px; font-size:12px; line-height:1.55; border-top:2px dashed #cfc4a4;}
#log p{margin:0 0 3px; font-weight:600;}
#log p.money{color:#7a6c00;} #log p.bad{color:var(--accent);} #log p.sys{color:#6b6f7c;}
/* ---------- modal ---------- */
#overlay{position:fixed; inset:0; background:rgba(30,34,46,.55); display:none; align-items:center; justify-content:center; z-index:70; padding:16px;}
#overlay.show{display:flex;}
.modal{background:var(--panel); border:3px solid var(--ink); border-radius:16px; max-width:560px; width:100%;
  max-height:86dvh; overflow-y:auto; box-shadow:0 12px 40px rgba(0,0,0,.4);}
.modal header{padding:13px 18px 9px; font-weight:800; font-size:18px; letter-spacing:.05em; border-bottom:2px dashed #cfc4a4;}
.modal header.evil{background:#33254d; color:#fff; border-radius:12px 12px 0 0; border-bottom-color:#33254d;}
.modal header.gold{background:var(--gold); border-radius:12px 12px 0 0; border-bottom-color:var(--gold);}
.modal .body{padding:14px 18px; font-size:14px; line-height:1.7;}
.modal .btns{display:flex; gap:8px; padding:0 18px 16px; flex-wrap:wrap; justify-content:flex-end;}
.mbtn{background:var(--ink); color:#fff; font-weight:800; border-radius:9px; padding:10px 20px; font-size:14px;}
.mbtn.primary{background:var(--accent);}
.mbtn.buy{background:var(--green); padding:6px 14px; font-size:13px;}
.mbtn:disabled{background:#B9BDC7; cursor:default;}
table.props{width:100%; border-collapse:collapse; font-size:13px;}
table.props th{font-size:11px; color:#6b6f7c; text-align:left; padding:3px 6px; letter-spacing:.08em;}
table.props td{padding:5px 6px; border-top:1.5px dashed #ddd2b2; font-weight:700;}
table.props td.num{text-align:right;}
.ownedby{font-size:11px; border-radius:5px; padding:1px 6px; color:#fff; font-weight:800; white-space:nowrap;}
.bignum{font-size:26px; font-weight:800; letter-spacing:.03em;}
.bignum.gold{color:#B07E12;} .bignum.bad{color:var(--accent);}
/* ---------- start / finale ---------- */
#startscr{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg,#7FC4DE 0%, #8FCFE3 45%, #F4ECD6 46%, #EFE3C4 100%); padding:16px; overflow:auto;}
#startbox{max-width:520px; width:100%; text-align:center;}
#titlemark{display:inline-block; background:var(--panel); border:3.5px solid var(--ink); border-radius:18px;
  padding:22px 34px 18px; box-shadow:var(--shadow); position:relative;}
#titlemark::before{content:""; position:absolute; left:14px; right:14px; top:10px; height:7px; border-radius:99px;
  background:repeating-linear-gradient(90deg, var(--accent) 0 22px, var(--panel) 22px 30px);}
#titlemark h1{font-size:clamp(38px,9vw,58px); font-weight:800; letter-spacing:.14em; margin-top:12px; text-wrap:balance;}
#titlemark h1 span{color:var(--accent);}
#titlemark .sub{font-weight:800; letter-spacing:.42em; font-size:12px; color:#6b6f7c; margin-top:4px;}
#startform{margin-top:20px; background:var(--panel); border:3px solid var(--ink); border-radius:14px; padding:16px 20px;
  text-align:left; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px;}
#startform label{font-weight:800; font-size:13px; display:flex; align-items:center; gap:10px; justify-content:space-between;}
#startform select,#startform input{font-family:inherit; font-size:14px; font-weight:800; padding:7px 10px;
  border:2px solid var(--ink); border-radius:8px; background:#fff; color:var(--ink);}
#startform input{width:11em;}
#startbtn{background:var(--accent); color:#fff; font-size:19px; font-weight:800; letter-spacing:.18em;
  border-radius:12px; padding:14px; box-shadow:0 5px 0 #A33327;}
#startbtn:active{transform:translateY(3px); box-shadow:0 2px 0 #A33327;}
#howtobtn{background:var(--ink); color:#fff; font-size:14px; font-weight:800; border-radius:10px; padding:11px;}
.howto p{margin:0 0 10px;}
.rulenote{font-size:12px; font-weight:700; color:#6b6f7c; line-height:1.7;}
.finrow{display:grid; grid-template-columns:44px 1fr auto; gap:10px; align-items:center; background:var(--paper);
  border:2px solid var(--ink); border-radius:10px; padding:9px 13px; margin-bottom:7px; opacity:0; transform:translateY(8px);
  transition:opacity .4s, transform .4s;}
.finrow.reveal{opacity:1; transform:none;}
.finrow .frk{font-size:21px; font-weight:800;}
.finrow.first{background:#FFF0BF; border-color:#B07E12;}
.finrow .fnm{font-weight:800; display:flex; gap:7px; align-items:center;}
.finrow .fassets{font-weight:800; text-align:right;}
.finrow .fsub{font-size:11px; color:#6b6f7c; font-weight:700;}
</style>
</head>
<body>
<div id="app">
  <div id="mapwrap">
    <svg id="map" preserveAspectRatio="xMidYMid meet" aria-label="日本地図すごろくマップ"></svg>
    <div id="hud">
      <div class="hudcard" id="huddate">1年目 4月</div>
      <div class="hudcard" id="huddest"></div>
      <div id="hudbtns">
        <button class="hudbtn" id="helpbtn" aria-label="あそびかた">?</button>

        <button class="hudbtn" id="viewbtn" aria-pressed="false">全体図</button>
        <button class="hudbtn" id="mutebtn" aria-pressed="false">音 ON</button>
      </div>
    </div>
    <div id="banner" role="status"></div>
    <div id="destarrow" hidden><span id="destarrowdir">➤</span><span id="destarrowtxt"></span></div>
    <div id="dock">
      <div id="dockmain">
        <div id="whoami">
          <div id="whoname"></div>
          <div id="whocash"></div>
        </div>
        <button id="dicebtn" disabled>サイコロ!</button>
        <div id="diceview"></div>
        <div id="hand"></div>
        <button id="assetsbtn">資産</button>
      </div>
    </div>
  </div>
  <div id="side">
    <h2>そうしさんランキング</h2>
    <div id="ranking"></div>
    <h2>できごと</h2>
    <div id="log"></div>
  </div>
</div>
<div id="overlay"></div>
<div id="startscr">
  <div id="startbox">
    <div id="titlemark">
      <h1>デン<span>鉄</span></h1>
      <div class="sub">DENTYA・日本一周すごろく</div>
    </div>
    <form id="startform">
      <label>プレイヤー名 <input id="pname" value="あなた" maxlength="6"></label>
      <label>あそぶ年数
        <select id="pyears">
          <option value="1">1年(おためし)</option>
          <option value="3" selected>3年</option>
          <option value="5">5年</option>
          <option value="10">10年</option>
        </select>
      </label>
      <label>CPUの人数
        <select id="pcpus"><option value="1">1人</option><option value="2">2人</option><option value="3" selected>3人</option></select>
      </label>
      <label>演出スピード
        <select id="pspeed"><option value="1" selected>ふつう</option><option value="0.55">はやい</option><option value="0.3">ばくそく</option></select>
      </label>
      <p class="rulenote">キミは鉄道会社の社長!サイコロで進んで目的地に一番乗りすれば援助金。駅では物件を買って毎年3月の決算で収益、独占すれば2倍。目的地にビリだと貧乏神が…!最後に総資産がいちばん多い人の勝ち。</p>
      <button id="startbtn" type="submit">出発進行!</button>
      <button id="howtobtn" type="button">あそびかたをよむ(はじめての人向け)</button>
    </form>
  </div>
</div>

(function buildGraph(){
  const rng=mulberry32(20260703);
  CITIES.forEach((c,i)=>{
    G.cityIdx[c[0]]=G.nodes.length;
    G.nodes.push({type:"city",name:c[0],x:PRJX(c[1]),y:PRJY(c[2]),ci:i,pw:c[0].length*10.5+14});
    G.adj.push([]);
  });
  // 過密地帯(関東・関西など)は駅名標が重ならないよう少しだけ押し広げる。
  // ただし元の位置から離れすぎないよう上限をかけ、海の上に出た駅は陸へ引き戻す。
  const anchors=G.nodes.slice(0,CITIES.length).map(n=>({x:n.x,y:n.y}));
  for(let it=0;it<50;it++){
    for(let a=0;a<CITIES.length;a++)for(let b=a+1;b<CITIES.length;b++){
      const A=G.nodes[a],B=G.nodes[b];
      const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy),min=50;
      if(d<min&&d>0.01){const push=(min-d)/2/d;A.x-=dx*push;A.y-=dy*push;B.x+=dx*push;B.y+=dy*push;}
    }
    for(let a=0;a<CITIES.length;a++){
      const A=G.nodes[a],an=anchors[a];
      const dx=A.x-an.x,dy=A.y-an.y,d=Math.hypot(dx,dy),cap=30;
      if(d>cap){A.x=an.x+dx/d*cap;A.y=an.y+dy/d*cap;}
    }
  }
  const polys=COAST.map(isl=>isl.map(p=>[PRJX(p[0]),PRJY(p[1])]));
  const inland=(x,y)=>polys.some(poly=>{
    let inside=false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
      const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
      if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)inside=!inside;
    }
    return inside;
  });
  for(let a=0;a<CITIES.length;a++){
    const n=G.nodes[a],an=anchors[a];
    if(inland(n.x,n.y)||!inland(an.x,an.y))continue;
    let fixed=false;
    for(let t=0.15;t<1&&!fixed;t+=0.15){
      const x=n.x+(an.x-n.x)*t,y=n.y+(an.y-n.y)*t;
      if(inland(x,y)){n.x=x;n.y=y;fixed=true;}
    }
    if(!fixed){n.x=an.x;n.y=an.y;}
  }
  const link=(a,b)=>{G.adj[a].push(b);G.adj[b].push(a);};
  G.edgeLines=[];
  for(const [an,bn,kk,sea] of EDGES){
    const k=kk>=2?kk-1:kk; // 全体をおよそ200駅に調整
    const a=G.cityIdx[an], b=G.cityIdx[bn];
    const A=G.nodes[a], B=G.nodes[b];
    let prev=a; const chain=[a];
    for(let j=1;j<=k;j++){
      const t=j/(k+1);
      const nx=A.x+(B.x-A.x)*t, ny=A.y+(B.y-A.y)*t;
      const dx=B.x-A.x, dy=B.y-A.y, len=Math.hypot(dx,dy)||1;
      const off=(rng()-0.5)*22;
      const r=rng();
      const type= r<0.32?"blue" : r<0.56?"red" : r<0.80?"card" : r<0.90?"lotto" : "warp";
      const id=G.nodes.length;
      G.nodes.push({type,x:nx-dy/len*off,y:ny+dx/len*off,sea:!!sea});
      G.adj.push([]);
      link(prev,id); prev=id; chain.push(id);
    }
    link(prev,b); chain.push(b);
    G.edgeLines.push({chain,sea:!!sea});
  }
})();
function distsFrom(src){
  const d=new Array(G.nodes.length).fill(-1); d[src]=0;
  const q=[src];
  for(let h=0;h<q.length;h++){const u=q[h];for(const v of G.adj[u])if(d[v]<0){d[v]=d[u]+1;q.push(v);}}
  return d;
}
const bfsDist=(a,b)=>distsFrom(a)[b];

/* ================= state ================= */
const S={players:[],turn:0,monthIdx:0,years:3,dest:-1,arrivals:0,
  bonbi:{holder:-1,form:"normal",turns:0},drops:{},over:false,speed:1};
const yearOf=()=>Math.floor(S.monthIdx/12)+1;
const monthOf=()=>(S.monthIdx+3)%12+1;
const yearMult=()=>1+0.6*(yearOf()-1);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms*S.speed));

function fmtMoney(m){ // m は「万」単位
  const neg=m<0; m=Math.round(Math.abs(m));
  const oku=Math.floor(m/10000), man=m%10000;
  let s= oku>0 ? (man>0?`${oku}億${man}万円`:`${oku}億円`) : `${man}万円`;
  return neg?`▲${s}`:s;
}
function propOwners(ci){return CITIES[ci][3].map((_,pi)=>S.propOwner[ci][pi]);}
function isMonopoly(ci,pl){return propOwners(ci).every(o=>o===pl);}
function cityIncome(ci,pl){
  let inc=0; const mono=isMonopoly(ci,pl);
  CITIES[ci][3].forEach((p,pi)=>{ if(S.propOwner[ci][pi]===pl) inc+=p[1]*p[2]/100*(mono?2:1); });
  return Math.round(inc);
}
function playerIncome(pl){let t=0;for(let ci=0;ci<CITIES.length;ci++)t+=cityIncome(ci,pl);return t;}
function propValue(pl){let t=0;for(let ci=0;ci<CITIES.length;ci++)CITIES[ci][3].forEach((p,pi)=>{if(S.propOwner[ci][pi]===pl)t+=p[1];});return t;}
function totalAssets(p){return p.cash+propValue(p.i);}

/* ================= sound ================= */
let AC=null, muted=false;
function ac(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); } return AC; }
function tone(freq,dur,type="square",vol=0.08,when=0){
  if(muted) return;
  try{
    const c=ac(), o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,c.currentTime+when);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+when+dur);
    o.connect(g).connect(c.destination);
    o.start(c.currentTime+when); o.stop(c.currentTime+when+dur+0.02);
  }catch(e){}
}
const SND={
  tick:()=>tone(660,0.05,"square",0.05),
  dice:()=>{for(let i=0;i<5;i++)tone(440+rnd(400),0.04,"square",0.05,i*0.06);},
  coin:()=>{tone(880,0.09,"sine",0.1);tone(1318,0.14,"sine",0.1,0.09);},
  bad:()=>{tone(220,0.18,"sawtooth",0.09);tone(147,0.3,"sawtooth",0.09,0.16);},
  card:()=>{tone(523,0.07,"triangle",0.1);tone(784,0.1,"triangle",0.1,0.07);},
  fanfare:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,0.16,"triangle",0.12,i*0.13));tone(1047,0.5,"triangle",0.12,0.55);},
  bonbi:()=>{[196,185,175,165].forEach((f,i)=>tone(f,0.3,"sawtooth",0.1,i*0.28));},
  king:()=>{[98,93,98,87].forEach((f,i)=>tone(f,0.4,"sawtooth",0.14,i*0.3));tone(587,0.7,"sawtooth",0.06,0.5);},
  win:()=>{[523,587,659,784,880,1047].forEach((f,i)=>tone(f,0.15,"triangle",0.12,i*0.11));},
};

/* ================= svg render ================= */
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("map");
const el=(t,at,parent)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);(parent||svg).appendChild(e);return e;};
let gLand,gEdge,gNode,gDrop,gDest,gTok,gOpt;
const nodeEls=[];
function renderMap(){
  svg.innerHTML=""; nodeEls.length=0;
  gLand=el("g",{}); gEdge=el("g",{}); gNode=el("g",{});
  gDrop=el("g",{"pointer-events":"none"}); gDest=el("g",{});
  gTok=el("g",{"pointer-events":"none"}); gOpt=el("g",{});
  for(const isl of COAST){
    const d="M"+isl.map(p=>`${PRJX(p[0]).toFixed(1)},${FY(PRJY(p[1])).toFixed(1)}`).join("L")+"Z";
    el("path",{d,class:"landside","stroke-width":10,transform:"translate(0,9)"},gLand); // 陸地の厚み
    el("path",{d,class:"landblob","stroke-width":10},gLand);
  }
  for(const e of G.edgeLines){
    const pts=e.chain.map(i=>`${G.nodes[i].x},${FY(G.nodes[i].y)}`).join(" ");
    el("polyline",{points:pts,class:"edge"+(e.sea?" sea":"")},gEdge);
  }
  // 手前(南)のものが上にかぶさるよう、Y座標順に描画する
  const order=G.nodes.map((n,i)=>i).sort((a,b)=>G.nodes[a].y-G.nodes[b].y);
  for(const i of order){
    const n=G.nodes[i], fy=FY(n.y);
    const g=el("g",{},gNode);
    if(n.type==="city"){
      el("rect",{x:n.x-n.pw/2,y:fy-6,width:n.pw,height:20,rx:6,class:"citypill-side"},g);
      el("rect",{x:n.x-n.pw/2,y:fy-12,width:n.pw,height:20,rx:6,class:"citypill"},g);
      el("text",{x:n.x,y:fy+1.8,class:"cityname"},g).textContent=n.name;
      const dots=el("g",{class:"dots"},g); g._dots=dots;
      g.style.cursor="pointer"; // 駅をタップすると物件情報を確認できる
      g.addEventListener("click",()=>{ if(!$("overlay").classList.contains("show"))showCityInfo(n.ci); });
    }else{
      el("ellipse",{cx:n.x,cy:fy+5,rx:9,ry:6,class:"sqside "+n.type},g);
      el("ellipse",{cx:n.x,cy:fy,rx:9,ry:6,class:"sq "+n.type},g);
      const lbl={blue:"+",red:"−",card:"C",lotto:"宝",warp:"W"}[n.type];
      el("text",{x:n.x,y:fy+3,class:"sqlabel"},g).textContent=lbl;
    }
    nodeEls[i]=g;
  }
  updateOwnDots(); drawDest(); drawTokens();
}
function updateOwnDots(){
  G.nodes.forEach((n,i)=>{
    if(n.type!=="city")return;
    const dots=nodeEls[i]._dots; dots.innerHTML="";
    const owners=S.propOwner?propOwners(n.ci):[];
    owners.forEach((o,j)=>{ if(o>=0) el("circle",{cx:n.x-n.pw/2+5+j*8,cy:FY(n.y)+18,r:3.2,fill:PCOLORS[o],class:"owndot"},dots); });
    if(owners.length&&owners[0]>=0&&owners.every(o=>o===owners[0]))
      el("text",{x:n.x+n.pw/2,y:FY(n.y)+22,"font-size":"10","font-weight":"800",fill:PCOLORS[owners[0]],"text-anchor":"end"},dots).textContent="独占!";
  });
}
function drawDest(){
  gDest.innerHTML="";
  if(S.dest<0)return;
  const n=G.nodes[S.dest], fy=FY(n.y);
  el("ellipse",{cx:n.x,cy:fy,rx:26,ry:16,class:"dest-ring"},gDest);
  el("line",{x1:n.x+20,y1:fy-6,x2:n.x+20,y2:fy-44,stroke:"var(--accent)","stroke-width":3.5,"stroke-linecap":"round"},gDest);
  el("path",{d:`M${n.x+21.5},${fy-44} l24,7.5 l-24,7.5 Z`,fill:"var(--accent)",stroke:"#fff","stroke-width":1.5},gDest);
  el("text",{x:n.x,y:fy-50,class:"dest-flag"},gDest).textContent="目的地";
}
function drawDrops(){
  if(!gDrop)return;
  gDrop.innerHTML="";
  for(const ni in S.drops){
    const n=G.nodes[ni], k=S.drops[ni].length, fy=FY(n.y);
    if(!k){delete S.drops[ni];continue;}
    const g=el("g",{},gDrop);
    el("ellipse",{cx:n.x+14,cy:fy-8,rx:8,ry:3,fill:"rgba(0,0,0,.22)"},g);
    el("rect",{x:n.x+7,y:fy-31,width:14,height:14,rx:3,
      transform:`rotate(45 ${n.x+14} ${fy-24})`,fill:"#F2B33D",stroke:"#fff","stroke-width":1.8},g);
    el("text",{x:n.x+14,y:fy-20,"font-size":"10","font-weight":"800","text-anchor":"middle",fill:"#4a3b12"},g).textContent=k;
  }
}
function checkDrop(p){
  const dr=S.drops[p.pos];
  if(!dr||!dr.length)return;
  const keep=[];
  for(const it of dr){
    if(it.card){
      if(p.cards.length<HAND_MAX){
        p.cards.push(it.card);
        log(`${p.name}:落ちていた${CARDS[it.card].n}を拾った!`,"money");
      } else keep.push(it);
    } else if(it.prop){
      S.propOwner[it.prop.ci][it.prop.pi]=p.i;
      log(`${p.name}:吹き飛ばされた物件「${CITIES[it.prop.ci][0]}の${it.prop.pr[0]}」をタダで手に入れた!`,"money");
    }
  }
  if(keep.length)S.drops[p.pos]=keep; else delete S.drops[p.pos];
  SND.coin();
  banner(`${p.name}が落とし物を拾った!`,"good");
  drawDrops();
}
function drawTokens(){
  gTok.innerHTML="";
  const byPos={};
  S.players.forEach(p=>{(byPos[p.pos]??=[]).push(p);});
  for(const pos in byPos){
    const list=byPos[pos], n=G.nodes[pos], m=list.length;
    // 手番のコマを最後(最前面)に描く
    list.sort((a,b)=>(a.i===S.turn?1:0)-(b.i===S.turn?1:0));
    list.forEach((p,k)=>{
      // 重なったら横一列にならべる(円形配置より駅名が読みやすい)
      const x=n.x+(k-(m-1)/2)*17, base=FY(n.y)-8;
      const g=el("g",{},gTok);
      // 影+立ち姿のコマ(2.5D)
      el("ellipse",{cx:x,cy:base+2,rx:9.5,ry:3.4,fill:"rgba(0,0,0,.28)"},g);
      el("rect",{x:x-8.5,y:base-24,width:17,height:25,rx:8.5,fill:p.color,class:"token"},g);
      el("text",{x,y:base-10.5,class:"tokentxt"},g).textContent=p.name[0];
      if(S.bonbi.holder===p.i){
        el("circle",{cx:x+9,cy:base-28,r:7.5,class:"bonbadge"},g);
        el("text",{x:x+9,y:base-24.8,class:"bonbadgetxt"},g).textContent=BONBI_CHAR[S.bonbi.form];
      }
      if(p.i===S.turn&&!S.over){ // いま動かしているコマの目印
        el("path",{d:`M${x-8},${base-39} h16 l-8,10 Z`,class:"turnmark"},g);
      }
    });
  }
}

/* camera:自分のいるところを中心に大きく表示 */
const cam={x:760,y:900,w:1600}, camT={...cam};
let fullView=false, FOLLOW_W=400;
function camTo(x,y,w){
  if(fullView){
    const wrap=document.getElementById("mapwrap");
    const asp=wrap.clientHeight/Math.max(1,wrap.clientWidth);
    camT.x=760; camT.y=FY(910); camT.w=Math.max(1560,FY(1880)/asp);
  } else {camT.x=x;camT.y=y;camT.w=w||FOLLOW_W;}
}
(function camLoop(){
  cam.x+=(camT.x-cam.x)*0.14; cam.y+=(camT.y-cam.y)*0.14; cam.w+=(camT.w-cam.w)*0.14;
  const wrap=document.getElementById("mapwrap");
  const asp=wrap.clientHeight/Math.max(1,wrap.clientWidth);
  const h=cam.w*asp;
  svg.setAttribute("viewBox",`${cam.x-cam.w/2} ${cam.y-h/2} ${cam.w} ${h}`);
  updateDestArrow(wrap,cam.x-cam.w/2,cam.y-h/2,cam.w,h);
  requestAnimationFrame(camLoop);
})();
// 目的地が画面の外にあるとき、画面のはしに方向矢印を出す
function updateDestArrow(wrap,vx,vy,vw,vh){
  const box=document.getElementById("destarrow");
  if(S.dest<0||S.over||S.players.length===0){box.hidden=true;return;}
  const W=wrap.clientWidth,H=wrap.clientHeight;
  const n=G.nodes[S.dest];
  const sx=(n.x-vx)/vw*W, sy=(FY(n.y)-vy)/vh*H;
  if(sx>=30&&sx<=W-30&&sy>=30&&sy<=H-30){box.hidden=true;return;}
  const cx=W/2,cy=H/2,dx=sx-cx,dy=sy-cy;
  const padY=dy<0?150:120; // 上はバナーやHUDと重ならないよう広めに
  const t=Math.min((W/2-80)/Math.abs(dx||1e-9),(H/2-padY)/Math.abs(dy||1e-9),1);
  box.style.left=(cx+dx*t)+"px";
  box.style.top=(cy+dy*t)+"px";
  document.getElementById("destarrowdir").style.transform=`rotate(${Math.atan2(dy,dx)*180/Math.PI}deg)`;
  document.getElementById("destarrowtxt").textContent=`目的地 ${n.name}`;
  box.hidden=false;
}
function focusPlayer(p){const n=G.nodes[p.pos];camTo(n.x,FY(n.y));}

/* ================= UI helpers ================= */
const $=id=>document.getElementById(id);
function log(msg,kind){
  const p=document.createElement("p");
  if(kind)p.className=kind;
  p.textContent=msg;
  $("log").prepend(p);
  while($("log").children.length>70)$("log").lastChild.remove();
}
let bannerTimer=null;
function banner(msg,kind,hold){
  const b=$("banner");
  b.textContent=msg; b.className="show"+(kind?" "+kind:"");
  clearTimeout(bannerTimer);
  if(!hold)bannerTimer=setTimeout(()=>b.classList.remove("show"),2200*S.speed+800);
}
function modal({title,html,buttons,headKlass}){
  return new Promise(res=>{
    const ov=$("overlay");
    ov.innerHTML="";
    const m=document.createElement("div"); m.className="modal";
    m.innerHTML=`<header class="${headKlass||""}">${title}</header><div class="body">${html||""}</div><div class="btns"></div>`;
    const btns=m.querySelector(".btns");
    (buttons||[{label:"OK",value:true,primary:true}]).forEach(b=>{
      const bt=document.createElement("button");
      bt.className="mbtn"+(b.primary?" primary":"");
      bt.textContent=b.label;
      bt.onclick=()=>{ov.classList.remove("show");ov.innerHTML="";res(b.value);};
      btns.appendChild(bt);
    });
    ov.appendChild(m); ov.classList.add("show");
    m.querySelector(".mbtn").focus();
  });
}
function ownerTag(o){return o<0?`<span class="ownedby" style="background:#B9BDC7">なし</span>`
  :`<span class="ownedby" style="background:${PCOLORS[o]}">${S.players[o].name}</span>`;}

function updateHUD(){
  $("huddate").textContent=`${yearOf()}年目 ${monthOf()}月`;
  const p=S.players[S.turn];
  const d=p?bfsDist(p.pos,S.dest):0;
  $("huddest").innerHTML=S.dest<0?"":
    `<span class="to">▼${G.nodes[S.dest].name}</span> まで ${d} マス<small>とうちゃく援助金 ${fmtMoney(currentPrize())}</small>`;
}
function currentPrize(){return Math.round((1000+600*S.arrivals)*yearMult());}
function updateRanking(){
  const list=[...S.players].sort((a,b)=>totalAssets(b)-totalAssets(a));
  $("ranking").innerHTML="";
  list.forEach((p,i)=>{
    const row=document.createElement("div");
    row.className="prow"+(p.i===S.turn?" active":"");
    const bon=S.bonbi.holder===p.i?`<span class="bontag${S.bonbi.form!=="normal"?" king":""}">${BONBI_LABEL[S.bonbi.form]}</span>`:"";
    row.innerHTML=`<div class="rk">${i+1}</div>
      <div class="nm"><span class="chipdot" style="background:${p.color}"></span>${p.name}${p.human?"":" (CPU)"} ${bon}</div>
      <div class="total">${fmtMoney(totalAssets(p))}</div>
      <div class="sub">持ち金 ${fmtMoney(p.cash)} ・ 札${p.cards.length}</div>`;
    row.onclick=()=>showAssets(p);
    $("ranking").appendChild(row);
  });
}
function updateDock(){
  const p=S.players[S.turn];
  if(!p)return;
  $("whoname").innerHTML=`<span class="chipdot" style="background:${p.color}"></span>${p.name}のばん`;
  $("whocash").textContent=`持ち金 ${fmtMoney(p.cash)}`;
  $("whocash").className=p.cash<0?"minus":"";
  const hand=$("hand"); hand.innerHTML="";
  const hp=S.players.find(q=>q.human);
  if(hp){
    hp.cards.forEach((cid,idx)=>{
      const c=CARDS[cid];
      const bt=document.createElement("button");
      bt.className="cardchip"+(c.kind==="passive"?" passive":"");
      bt.innerHTML=`${c.n}<small>${c.d}</small>`;
      bt.onclick=()=>{ if(c.kind!=="passive"&&pendingAction){const r=pendingAction;pendingAction=null;r({kind:"card",idx});} };
      hand.appendChild(bt);
    });
  }
}
function updateAll(){updateHUD();updateRanking();updateDock();updateOwnDots();drawTokens();drawDest();drawDrops();}

function showCityInfo(ci){
  const rows=CITIES[ci][3].map((pr,pi)=>{
    const o=S.propOwner?S.propOwner[ci][pi]:-1;
    return `<tr><td>${pr[0]}</td><td class="num">${fmtMoney(pr[1])}</td><td class="num">${pr[2]}%</td><td>${ownerTag(o)}</td></tr>`;
  }).join("");
  const owners=S.propOwner?propOwners(ci):[];
  const mono=owners.length&&owners[0]>=0&&owners.every(o=>o===owners[0]);
  modal({title:`${CITIES[ci][0]}駅の物件じょうほう`,html:
    `${mono?`<p><b style="color:#B07E12">★${S.players[owners[0]].name}が独占中!(収益2倍)</b></p>`:""}
     <table class="props"><tr><th>物件</th><th style="text-align:right">価格</th><th style="text-align:right">収益率</th><th>持ち主</th></tr>${rows}</table>
     <p class="rulenote" style="margin-top:8px">この駅に止まると、売り物件を買えるよ。</p>`});
}
/* human action wiring */
let pendingAction=null;

async function showAssets(p){
  let rows="",totalInc=0;
  for(let ci=0;ci<CITIES.length;ci++){
    const owned=CITIES[ci][3].map((pr,pi)=>({pr,pi})).filter(x=>S.propOwner[ci][x.pi]===p.i);
    if(!owned.length)continue;
    const mono=isMonopoly(ci,p.i);

    owned.forEach(({pr})=>{
      const inc=Math.round(pr[1]*pr[2]/100*(mono?2:1)); totalInc+=inc;
      rows+=`<tr><td>${pr[0]}</td><td class="num">${fmtMoney(pr[1])}</td><td class="num">年 ${fmtMoney(inc)}</td></tr>`;
    });
  }
  await modal({title:`${p.name}の資産`,html:
    `<p>持ち金 <b>${fmtMoney(p.cash)}</b> / 物件 <b>${fmtMoney(propValue(p.i))}</b> / 総資産 <b>${fmtMoney(totalAssets(p))}</b></p>

     <table class="props">${rows||'<tr><td>物件はまだ持っていません</td></tr>'}</table>`});
}

/* ================= game flow ================= */
function newDest(exclude){
  const d=distsFrom(exclude);
  const ids=Object.values(G.cityIdx);
  let cands=ids.filter(id=>id!==exclude&&d[id]>=8&&d[id]<=24);
  if(!cands.length)cands=ids.filter(id=>id!==exclude&&d[id]>=8);
  if(!cands.length)cands=ids.filter(id=>id!==exclude);
  S.dest=pick(cands);
  drawDest();
}
const DICE_ROT={1:[0,0],2:[0,-90],3:[0,180],4:[0,90],5:[-90,0],6:[90,0]};
async function showDice(rolls){
  const dv=$("diceview"); dv.innerHTML="";
  SND.dice();
  const cubes=rolls.map(()=>{
    const d=document.createElement("div"); d.className="die";
    const c=document.createElement("div"); c.className="cube";
    for(let f=1;f<=6;f++){
      const fa=document.createElement("div");
      fa.className=`f f${f}`; fa.textContent=f;
      c.appendChild(fa);
    }
    c.style.transform="rotateX(-30deg) rotateY(40deg)";
    d.appendChild(c); dv.appendChild(d);
    return c;
  });
  await sleep(60);
  cubes.forEach((c,i)=>{
    const [rx,ry]=DICE_ROT[rolls[i]];
    c.style.transform=`rotateX(${rx+720}deg) rotateY(${ry-720}deg)`;
  });
  await sleep(750);
}
function chooseCpuStep(p,opts,target){
  const dt=distsFrom(target);
  let best=opts[0],bd=Infinity;
  for(const o of opts){ if(dt[o]>=0&&dt[o]<bd){bd=dt[o];best=o;} }
  return best;
}
async function chooseHumanStep(p,opts){
  banner("すすむ方向をえらんでね(赤いリング=目的地への近道)","",true);
  const dd=distsFrom(S.dest);
  let best=Infinity;
  for(const o of opts)if(dd[o]>=0&&dd[o]<best)best=dd[o];
  return new Promise(res=>{
    const marks=[];
    opts.forEach(o=>{
      const n=G.nodes[o], fy=FY(n.y), rec=dd[o]===best;
      const ring=el("ellipse",{cx:n.x,cy:fy,rx:18,ry:12,class:"opt-ring"+(rec?" rec":"")},gOpt);
      const lbl=el("text",{x:n.x,y:fy+24,class:"opt-lbl"+(rec?" rec":"")},gOpt);
      lbl.textContent=`あと${dd[o]}マス`;
      const hit=el("ellipse",{cx:n.x,cy:fy,rx:28,ry:19,class:"opt-hit"},gOpt);
      hit.addEventListener("click",()=>{
        marks.forEach(m=>m.remove());
        $("banner").classList.remove("show");
        res(o);
      });
      marks.push(ring,lbl,hit);
    });
  });
}
async function moveBy(p,steps){
  const target= S.bonbi.holder===p.i ? nearestOther(p) : S.dest;
  for(let s=0;s<steps;s++){
    let opts=G.adj[p.pos].filter(n=>n!==p.prev);
    if(!opts.length)opts=[p.prev];
    let next;
    if(opts.length===1)next=opts[0];
    else next= p.human? await chooseHumanStep(p,opts) : chooseCpuStep(p,opts,target);
    p.prev=p.pos; p.pos=next;
    SND.tick(); drawTokens(); focusPlayer(p);
    checkDrop(p);
    await sleep(230);
    if(next===S.dest){ await arrive(p); return; }
  }
  await landEffect(p);
}
function nearestOther(p){
  const d=distsFrom(p.pos);
  let best=-1,bd=Infinity;
  for(const q of S.players)if(q.i!==p.i&&d[q.pos]>=0&&d[q.pos]<bd){bd=d[q.pos];best=q.pos;}
  return best<0?S.dest:best;
}
function gainMoney(p,amt,msg,kind){
  p.cash+=amt;
  log(`${p.name}:${msg} ${amt>=0?"+":""}${fmtMoney(amt)}`,amt>=0?"money":"bad");
  (amt>=0?SND.coin:SND.bad)();
  banner(`${msg} ${amt>=0?"+":""}${fmtMoney(amt)}`,amt>=0?"good":"warn");
}
function giveCard(p,cid){
  if(p.cards.length>=HAND_MAX){log(`${p.name}:カードがいっぱいで もらえなかった…`,"sys");return false;}
  p.cards.push(cid);
  SND.card();
  log(`${p.name}:${CARDS[cid].n}を手に入れた!`);
  banner(`${CARDS[cid].n}を手に入れた!`);
  return true;
}
function randomCard(){
  const total=Object.values(CARDS).reduce((s,c)=>s+c.w,0);
  let r=Math.random()*total;
  for(const id in CARDS){r-=CARDS[id].w;if(r<=0)return id;}
  return "kyuko";
}
async function landEffect(p){
  const n=G.nodes[p.pos];
  await sleep(150);
  if(n.type==="city"){ await cityStop(p,n); return; }
  if(n.type==="blue"){ gainMoney(p,Math.round((80+rnd(280))*yearMult()),"プラス駅!臨時収入"); }
  else if(n.type==="red"){ gainMoney(p,-Math.round((80+rnd(280))*yearMult()),"マイナス駅…出費だ"); }
  else if(n.type==="card"){ giveCard(p,randomCard()); }
  else if(n.type==="lotto"){
    const r=Math.random();
    let amt=0,label="はずれ…";
    if(r>0.99){amt=10000;label="超大当たり!!1等!";}
    else if(r>0.95){amt=3000;label="大当たり!2等!";}
    else if(r>0.85){amt=1000;label="当たり!3等!";}
    else if(r>0.65){amt=400;label="小当たり!";}
    log(`${p.name}:宝くじ駅で抽選…${label}`);
    if(amt>0){await sleep(300);gainMoney(p,Math.round(amt*yearMult()),`宝くじ ${label}`);}
    else {banner("宝くじ…はずれ","warn");SND.bad();}
  }
  else if(n.type==="warp"){
    banner("ワープ駅!どこかへ飛ばされる!","warn");
    SND.card();
    await sleep(600);
    const cid=pick(Object.values(G.cityIdx).filter(i=>i!==S.dest&&i!==p.pos));
    p.pos=cid;p.prev=-1;
    drawTokens();focusPlayer(p);
    checkDrop(p);
    log(`${p.name}:ワープ駅で${G.nodes[cid].name}へ飛ばされた!`);
    await sleep(400);
    await cityStop(p,G.nodes[cid]);
  }
  updateAll();
}

const KAIJU={
  "青森":"名産怪獣リンゴリラ",
  "高松":"名産怪獣ウドンガー",
  "宮崎":"名産怪獣マンゴラス",

async function cityStop(p,n){
  const ci=n.ci;
  const hero=HEROES[n.name];
  if(hero&&Math.random()<0.35){
    SND.fanfare();
    await modal({title:"歴史ヒーロー登場!",headKlass:"gold",
      html:`<p><b>${hero.n}</b>があらわれた!</p><p>「${hero.msg}」</p>`});
    await hero.f(p);
    updateAll();
  }
  const kj=KAIJU[n.name];
  if(kj&&Math.random()<0.25){
    if(Math.random()<0.5){
      SND.fanfare();
      await modal({title:`${kj}あらわる!`,headKlass:"gold",
        html:`<p><b>${kj}</b>が${p.name}になついた!</p><p>名産品をどっさり分けてくれた!</p>`});
      gainMoney(p,Math.round((300+rnd(400))*yearMult()),`${kj}のおすそわけ!`);
    }else{
      SND.bad();
      await modal({title:`${kj}あらわる!`,headKlass:"evil",
        html:`<p><b>${kj}</b>が大あばれ!</p><p>${p.name}は巻きこまれてしまった…</p>`});
      gainMoney(p,-Math.round((200+rnd(400))*yearMult()),`${kj}が大あばれ…`);
    }
    updateAll();
  }
  const buyable=CITIES[ci][3].map((pr,pi)=>({pr,pi})).filter(x=>S.propOwner[ci][x.pi]<0);
  if(!buyable.length){log(`${p.name}:${n.name}に停車(売り物件なし)`,"sys");return;}
  if(p.human){ await buyDialog(p,ci); }
  else{
    let bought=[];
    const sorted=[...buyable].sort((a,b)=>a.pr[1]-b.pr[1]);
    for(const {pr,pi} of sorted){
      const wantMono=propOwners(ci).filter(o=>o===p.i).length===CITIES[ci][3].length-1;
      const reserve=wantMono?0:300;
      if(p.cash-pr[1]>=reserve){ p.cash-=pr[1]; S.propOwner[ci][pi]=p.i; bought.push(pr[0]); }
    }
    if(bought.length){
      SND.coin();
      log(`${p.name}:${n.name}で ${bought.join("、")} を購入!`);
      banner(`${p.name}が${n.name}で物件を購入!`);
      if(isMonopoly(ci,p.i)){log(`${p.name}:${n.name}を独占!収益2倍!!`,"money");banner(`${p.name}が${n.name}を独占!!`,"warn");SND.fanfare();}
      await sleep(600);
    }
  }
  updateAll();
}
async function buyDialog(p,ci){
  while(true){
    const props=CITIES[ci][3];
    let rows=props.map((pr,pi)=>{
      const o=S.propOwner[ci][pi];
      const can=o<0&&p.cash>=pr[1];
      return `<tr><td>${pr[0]}</td><td class="num">${fmtMoney(pr[1])}</td><td class="num">${pr[2]}%</td>
        <td>${o<0?`<button class="mbtn buy" data-pi="${pi}" ${can?"":"disabled"}>買う</button>`:ownerTag(o)}</td></tr>`;
    }).join("");
    const choice=await new Promise(res=>{
      const ov=$("overlay");
      ov.innerHTML="";
      const m=document.createElement("div"); m.className="modal";
      m.innerHTML=`<header class="gold">${CITIES[ci][0]}駅 物件案内</header>
        <div class="body"><p>持ち金:<b>${fmtMoney(p.cash)}</b> ${isMonopoly(ci,p.i)?'<b style="color:#B07E12">★この街を独占中!</b>':""}</p>
        <table class="props"><tr><th>物件</th><th style="text-align:right">価格</th><th style="text-align:right">収益率</th><th></th></tr>${rows}</table></div>
        <div class="btns"><button class="mbtn" id="buyclose">やめる</button></div>`;
      m.querySelectorAll(".buy").forEach(bt=>bt.onclick=()=>{ov.classList.remove("show");ov.innerHTML="";res(+bt.dataset.pi);});
      m.querySelector("#buyclose").onclick=()=>{ov.classList.remove("show");ov.innerHTML="";res(-1);};
      ov.appendChild(m); ov.classList.add("show");
    });
    if(choice<0)break;
    const pr=CITIES[ci][3][choice];
    p.cash-=pr[1]; S.propOwner[ci][choice]=p.i;
    SND.coin();
    log(`${p.name}:${CITIES[ci][0]}の${pr[0]}を購入!(${fmtMoney(pr[1])})`,"money");
    if(isMonopoly(ci,p.i)){
      SND.fanfare();
      log(`${p.name}:${CITIES[ci][0]}を独占!収益2倍!!`,"money");
      await modal({title:"独占!!",headKlass:"gold",html:`<p class="bignum gold">${CITIES[ci][0]}を独占!</p><p>この街の物件収益が<b>2倍</b>になった!</p>`});
    }
    updateAll();
  }
}
async function arrive(p){
  drawTokens();
  const prize=currentPrize();
  p.cash+=prize; S.arrivals++;
  SND.fanfare();
  log(`${p.name}:目的地 ${G.nodes[S.dest].name} に一番乗り!援助金${fmtMoney(prize)}!`,"money");
  await modal({title:"目的地とうちゃく!",headKlass:"gold",
    html:`<p><b>${p.name}</b>が <b>${G.nodes[S.dest].name}</b> に一番乗り!</p><p class="bignum gold">援助金 ${fmtMoney(prize)}</p>`});
  const old=S.dest;
  newDest(old);
  // 貧乏神:新目的地からいちばん遠いプレイヤーに憑依
  const others=S.players.filter(q=>q.i!==p.i);
  if(others.length){
    const d=distsFrom(old);
    let far=others[0];
    for(const q of others)if(d[q.pos]>d[far.pos])far=q;
    await attachBonbi(far);
  }
  banner(`つぎの目的地は ${G.nodes[S.dest].name}!`,"good");
  log(`つぎの目的地は ${G.nodes[S.dest].name} にきまった!`,"sys");
  const dn=G.nodes[S.dest];
  camTo(dn.x,FY(dn.y),500);
  await sleep(900);
  updateAll();
}
async function attachBonbi(q){
  const shieldIdx=q.cards.indexOf("shield");
  if(shieldIdx>=0){
    q.cards.splice(shieldIdx,1);
    log(`${q.name}:シールドカードが貧乏神をはじいた!`,"money");
    banner(`${q.name}のシールドが貧乏神をブロック!`,"good");
    SND.card();
    return;
  }
  S.bonbi={holder:q.i,form:"normal",turns:0};
  SND.bonbi();
  await modal({title:"貧乏神があらわれた!",headKlass:"evil",
    html:`<p>ビリだった <b>${q.name}</b> に<br><b style="font-size:20px">貧乏神</b>がとりついた…!</p><p>毎ターンわるさをするぞ。だれかに なすりつけろ!</p>`});
  log(`${q.name}に貧乏神がとりついた…!`,"bad");
  updateAll();
}
async function bonbiPhase(p){
  const B=S.bonbi;
  if(B.holder<0)return;
  const holder=S.players[B.holder];
  // なすりつけ(同じマスにいる相手へ)
  if(p.i!==B.holder&&p.pos===holder.pos){ await transferBonbi(p); return; }
  if(p.i===B.holder){
    const targets=S.players.filter(q=>q.i!==p.i&&q.pos===p.pos);
    if(targets.length){ await transferBonbi(pick(targets)); return; }
    await mischief(p);
  }
}
async function transferBonbi(to){
  const shieldIdx=to.cards.indexOf("shield");
  if(shieldIdx>=0){
    to.cards.splice(shieldIdx,1);
    log(`${to.name}:シールドカードが貧乏神をはじいた!`,"money");
    banner(`${to.name}のシールドが貧乏神をブロック!`,"good");
    return;
  }
  const from=S.players[S.bonbi.holder];
  S.bonbi.holder=to.i; S.bonbi.turns=0;
  SND.bonbi();
  log(`貧乏神が${from.name}から${to.name}になすりつけられた!`,"bad");
  banner(`貧乏神が${to.name}にのりうつ��た!`,"warn");
  await sleep(700);
  updateAll();
}
function ownedProps(pl){
  const owned=[];
  for(let ci=0;ci<CITIES.length;ci++)CITIES[ci][3].forEach((pr,pi)=>{if(S.propOwner[ci][pi]===pl)owned.push({ci,pi,pr});});
  return owned;
}
async function destroyProp(p,who){
  const owned=ownedProps(p.i);
  if(!owned.length)return false;
  const t=pick(owned);
  S.propOwner[t.ci][t.pi]=-1;
  SND.king();
  log(`${who}:${p.name}の「${CITIES[t.ci][0]}の${t.pr[0]}」を破壊した!!`,"bad");
  await modal({title:`${who}のわるさ`,headKlass:"evil",
    html:`<p><b>${CITIES[t.ci][0]}の${t.pr[0]}</b>(${fmtMoney(t.pr[1])})が<br><b style="color:var(--accent)">こなごなに破壊された!!</b></p>`});
  return true;
}
async function mischief(p){
  const B=S.bonbi, ym=yearMult();
  await sleep(400);
  if(B.form==="king"){
    if(Math.random()<0.4){
      if(!await destroyProp(p,"キングボンビー"))
        gainMoney(p,-Math.round((1200+rnd(2800))*ym),"キングボンビーがお金をばらまいた!!");
    }else{
      SND.king();
      gainMoney(p,-Math.round((1200+rnd(2800))*ym),"キングボンビーの豪遊!!");
    }
  }
  else if(B.form==="destroy"){
    SND.king();
    let broke=0;
    for(let k=0;k<2;k++)if(await destroyProp(p,"デストロイ号"))broke++;
    const amt=Math.round((2000+rnd(4000))*ym);
    gainMoney(p,-amt,"デストロイ号の破壊光線!!");
    if(!broke)log("デストロイ号:破壊する物件がなくて お金だけ焼きはらった…","bad");
  }
  else if(B.form==="pokon"){
    const owned=ownedProps(p.i);
    if(owned.length){
      const cnt=Math.min(owned.length,1+rnd(2));
      const d=distsFrom(p.pos);
      const cand=G.nodes.map((n,i)=>i).filter(i=>d[i]>=2&&d[i]<=8&&i!==S.dest);
      const names=[];
      for(let k=0;k<cnt;k++){
        const idx=rnd(owned.length);
        const t=owned.splice(idx,1)[0];
        S.propOwner[t.ci][t.pi]=-1;
        (S.drops[pick(cand)]??=[]).push({prop:t});
        names.push(`${CITIES[t.ci][0]}の${t.pr[0]}`);
      }
      SND.bad();
      drawDrops();
      log(`ポコン:${p.name}の物件「${names.join("、")}」を吹き飛ばした!近くの駅に落ちている…`,"bad");
      await modal({title:"ボンビーJr.ポコンのいたずら",headKlass:"evil",
        html:`<p><b>${names.join("」「")}</b>が<br><b style="color:var(--accent)">ポコーン!と吹き飛ばされた!!</b></p><p>近くの駅に落ちている。だれでも拾えるぞ…!(金色のマーク)</p>`});
    }else{
      gainMoney(p,-Math.round((200+rnd(500))*ym),"ポコンがだだをこねて出費…");
    }
  }
  else if(B.form==="big"){
    const n=1+rnd(6);
    SND.bad();
    if(p.cash<0){
      const before=p.cash;
      p.cash=Math.round(p.cash*(1+n*0.15));
      log(`ビッグボンビー:サイコロの目は${n}!${p.name}の借金が${fmtMoney(p.cash-before)}ふくらんだ!!`,"bad");
      await modal({title:"ビッグボンビーの悪行",headKlass:"evil",
        html:`<p>ビッグボンビーがサイコロをふった…出た目は<b>${n}</b>!</p><p class="bignum bad">借金が ${n*15}% 増えた!!</p><p>持ち金:${fmtMoney(p.cash)}</p>`});
    }else{
      gainMoney(p,-Math.round((n*150+rnd(300))*ym),`ビッグボンビーのサイコロ(${n})で大出費…`);
    }
  }
  else{
    const r=Math.random();
    if(r<0.2&&p.cards.length){
      const idx=rnd(p.cards.length);
      const cid=p.cards.splice(idx,1)[0];
      SND.bad();
      log(`貧乏神:${p.name}の${CARDS[cid].n}を線路に捨てた…`,"bad");
      banner(`貧乏神が${CARDS[cid].n}を捨てた…`,"warn");
    }else if(r<0.38){
      p.slow=(p.slow||0)+1;
      SND.bad();
      log(`貧乏神:${p.name}にしがみついて足止め!つぎのサイコロは1だ…`,"bad");
      banner("貧乏神が足止めしてきた!","warn");
    }else if(r<0.9){
      gainMoney(p,-Math.round((100+rnd(450))*ym),"貧乏神のむだづかい…");
    }else{
      log(`貧乏神:きょうは ひるねをしている…`,"sys");
      banner("貧乏神はひるね中…","");
    }
  }
  B.turns++;
  if(B.form==="normal"&&B.turns>=2&&Math.random()<0.22){
    const r=Math.random();
    B.form= r<0.4?"king" : r<0.7?"pokon" : "big";
    SND.king();
    const desc={king:"わるさが超凶悪になるぞ…!",pokon:"パパよりめいわく!?物件が吹き飛ばされるぞ…!",big:"借金がどんどんふくらむぞ…!"}[B.form];
    await modal({title:"!!!!",headKlass:"evil",
      html:`<p style="text-align:center" class="bignum bad">${BONBI_LABEL[B.form]}が誕生!!</p><p>貧乏神が変身した!${desc}<br>いそいで だれかに なすりつけろ!!</p>`});
    log(`貧乏神が${BONBI_LABEL[B.form]}に変身した!!`,"bad");
  }
  else if(B.form==="king"&&B.turns>=4&&yearOf()*2>=S.years&&Math.random()<0.2){
    B.form="destroy";
    SND.king();
    await modal({title:"!!!!!!",headKlass:"evil",
      html:`<p style="text-align:center" class="bignum bad">デストロイ号 発進!!</p><p>キングボンビーが最凶形態に変身した!<br>物件もお金も まとめて破壊されるぞ…!!</p>`});
    log("キングボンビーがデストロイ号に変身した!!","bad");
  }
  updateAll();
}
/* ---------- cards ---------- */
async function useCard(p,idx){
  const cid=p.cards[idx], c=CARDS[cid];
  if(c.kind==="move"){ p.cards.splice(idx,1); log(`${p.name}:${c.n}を使った!`); banner(`${c.n}!`); SND.card(); return {dice:c.dice}; }
  if(c.kind==="warp"){
    p.cards.splice(idx,1);
    SND.card();
    log(`${p.name}:ぶっとびカードを使った!`);
    banner("ぶっとび〜〜!","warn");
    await sleep(600);
    const cid2=pick(Object.values(G.cityIdx).filter(i=>i!==p.pos));
    p.pos=cid2;p.prev=-1;
    drawTokens();focusPlayer(p);
    checkDrop(p);
    await sleep(500);
    if(cid2===S.dest){await arrive(p);}else{await cityStop(p,G.nodes[cid2]);}
    return {done:true};
  }
  if(c.kind==="money"){
    p.cards.splice(idx,1);
    gainMoney(p,Math.round((200+rnd(600))*yearMult()),"福袋カード!");
    return null;
  }
  if(c.kind==="slow"){
    p.cards.splice(idx,1);
    const t=pick(S.players.filter(q=>q.i!==p.i));
    t.slow=(t.slow||0)+2;
    SND.card();
    log(`${p.name}:牛歩カード!${t.name}を足止めした!`);
    banner(`${t.name}は2ターンのあいだサイコロが1に…!`,"warn");
    await sleep(500);
    return null;
  }
  if(c.kind==="ohara"){
    if(S.bonbi.holder!==p.i){banner("貧乏神がついていないと使えないよ","warn");return null;}
    p.cards.splice(idx,1);
    S.bonbi.holder=-1; S.bonbi.form="normal";
    SND.fanfare();
    log(`${p.name}:おはらいカードで貧乏神を追いはらった!`,"money");
    await modal({title:"おはらい成功!",headKlass:"gold",html:"<p>貧乏神は とおくへ 飛んでいった…!</p>"});
    updateAll();
    return null;
  }
  if(c.kind==="throw"){
    if(S.bonbi.holder!==p.i){banner("貧乏神がついていないと使えないよ","warn");return null;}
    p.cards.splice(idx,1);
    const t=pick(S.players.filter(q=>q.i!==p.i));
    log(`${p.name}:豪速球カード!貧乏神をぶん投げた!`);
    banner("豪速球〜〜!!","warn");
    SND.card();
    await sleep(700);
    await transferBonbi(t);
    return null;
  }
  return null;
}
function cpuPreRoll(p){
  // 貧乏神対応
  if(S.bonbi.holder===p.i){
    let i=p.cards.indexOf("ohara"); if(i>=0)return {card:i};
    i=p.cards.indexOf("gosoku"); if(i>=0)return {card:i};
  }
  const d=bfsDist(p.pos,S.dest);
  const tryCards=["nozomi","tokkyu","kyuko"];
  if(d>=9&&Math.random()<0.65){
    for(const cid of tryCards){const i=p.cards.indexOf(cid);if(i>=0)return {card:i};}
  }
  const f=p.cards.indexOf("fuku");
  if(f>=0&&Math.random()<0.5)return {card:f};
  const u=p.cards.indexOf("ushiho");
  if(u>=0&&Math.random()<0.35)return {card:u};
  return {roll:true};
}
/* ---------- turn ---------- */
async function doTurn(p){
  updateAll(); focusPlayer(p);
  banner(`${p.name}のばん!`,"");
  await sleep(500);
  let diceCount=1, done=false;
  if(p.human){
    $("dicebtn").disabled=false;
    while(true){
      const a=await waitAction();
      if(a.kind==="roll"){diceCount=1;break;}
      const res=await useCard(p,a.idx);
      updateAll();
      if(res&&res.done){done=true;break;}
      if(res&&res.dice){diceCount=res.dice;break;}
      $("dicebtn").disabled=false;
    }
    $("dicebtn").disabled=true;
  }else{
    await sleep(400);
    let guard=0;
    while(guard++<4){
      const act=cpuPreRoll(p);
      if(act.roll){diceCount=1;break;}
      const res=await useCard(p,act.card);
      updateAll();
      if(res&&res.done){done=true;break;}
      if(res&&res.dice){diceCount=res.dice;break;}
    }
  }
  if(!done){
    let rolls=Array.from({length:diceCount},()=>1+rnd(6));
    if(p.slow>0){
      p.slow--;
      rolls=[1];
      banner(`${p.name}は足止め中…サイコロは1!`,"warn");
      log(`${p.name}:足止めされていてサイコロが1しか出ない…`,"bad");
    }
    await showDice(rolls);
    const total=rolls.reduce((a,b)=>a+b,0);
    log(`${p.name}:サイコロは ${rolls.join("・")} → ${total}マス進む`,"sys");
    await moveBy(p,total);
  }
  $("diceview").innerHTML="";
  await bonbiPhase(p);
  updateAll();
  await sleep(350);
}
async function settlement(){
  SND.fanfare();
  let rows="";
  for(const p of S.players){
    const inc=playerIncome(p.i);
    let interest=0;
    if(p.cash<0){interest=Math.round(p.cash*0.1);}
    p.cash+=inc+interest;
    rows+=`<tr><td><span class="chipdot" style="background:${p.color}"></span> ${p.name}</td>
      <td class="num" style="color:#2E7D4F">+${fmtMoney(inc)}</td>
      <td class="num" style="color:var(--accent)">${interest?fmtMoney(interest):"—"}</td>
      <td class="num"><b>${fmtMoney(p.cash)}</b></td></tr>`;
    log(`決算:${p.name} 収益+${fmtMoney(inc)}${interest?` 借金利子${fmtMoney(interest)}`:""}`,"money");
  }
  await modal({title:`${yearOf()}年目 3月 けっさん!`,headKlass:"gold",
    html:`<table class="props"><tr><th>プレイヤー</th><th style="text-align:right">物件収益</th><th style="text-align:right">借金利子</th><th style="text-align:right">持ち金</th></tr>${rows}</table>
    <p style="margin-top:8px" class="rulenote">物件の収益は 価格×収益率。独占した街は2倍!持ち金がマイナスだと利子10%がのしかかる…</p>`});
  updateAll();
}
async function finale(){
  S.over=true;
  SND.win();
  const list=[...S.players].sort((a,b)=>totalAssets(b)-totalAssets(a));
  const ov=$("overlay");
  ov.innerHTML="";
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<header class="gold">結果はっぴょう!(${S.years}年の旅)</header><div class="body" id="finbody"></div>
    <div class="btns"><button class="mbtn primary" id="againbtn">もういちど遊ぶ</button></div>`;
  ov.appendChild(m); ov.classList.add("show");
  const body=m.querySelector("#finbody");
  const rows=list.map((p,i)=>{
    const r=document.createElement("div");
    r.className="finrow"+(i===0?" first":"");
    r.innerHTML=`<div class="frk">${i+1}位</div>
      <div><div class="fnm"><span class="chipdot" style="background:${p.color}"></span>${p.name}${p.human?"":" (CPU)"}</div>
      <div class="fsub">持ち金 ${fmtMoney(p.cash)} ・ 物件 ${fmtMoney(propValue(p.i))}</div></div>
      <div class="fassets">${fmtMoney(totalAssets(p))}</div>`;
    body.appendChild(r);
    return r;
  });
  m.querySelector("#againbtn").onclick=()=>location.reload();
  for(let i=rows.length-1;i>=0;i--){
    await sleep(800);
    rows[i].classList.add("reveal");
    if(i===0)SND.fanfare();else SND.tick();
  }
  const winner=list[0];
  log(`ゲーム終了!優勝は ${winner.name}(総資産 ${fmtMoney(totalAssets(winner))})!`,"money");
}
async function gameLoop(){
  while(!S.over){
    const p=S.players[S.turn];
    await doTurn(p);
    if(S.over)break;
    S.turn=(S.turn+1)%S.players.length;
    if(S.turn===0){
      const isMarch=S.monthIdx%12===11;
      if(isMarch){
        await settlement();
        if(S.monthIdx===S.years*12-1){await finale();return;}
      }
      S.monthIdx++;
    }
    updateAll();
  }
}
/* ---------- start ---------- */
document.getElementById("startform").addEventListener("submit",e=>{
  e.preventDefault();
  ac(); // ユーザー操作でAudioContext解放
  const name=($("pname").value.trim()||"あなた").slice(0,6);
  S.years=+$("pyears").value;
  S.speed=+$("pspeed").value;
  const ncpu=+$("pcpus").value;
  S.propOwner=CITIES.map(c=>c[3].map(()=>-1));
  S.drops={};
  const start=G.cityIdx["東京"];
  S.players=[{i:0,name,human:true,color:PCOLORS[0],cash:1000,cards:["kyuko"],pos:start,prev:-1,slow:0}];
  for(let k=0;k<ncpu;k++)
    S.players.push({i:k+1,name:CPU_NAMES[k],human:false,color:PCOLORS[k+1],cash:1000,cards:["kyuko"],pos:start,prev:-1,slow:0});
  newDest(start);
  fullView=false;
  $("viewbtn").setAttribute("aria-pressed","false");
  $("startscr").style.display="none";
  renderMap(); updateAll();
  log(`日本一周すごろく、スタート!${S.years}年の旅がはじまる!`,"sys");
  log(`さいしょの目的地は ${G.nodes[S.dest].name}!`,"sys");
  banner(`目的地は ${G.nodes[S.dest].name}!しゅっぱつ!!`,"good");
  const dn=G.nodes[S.dest];
  camTo(dn.x,FY(dn.y),600);
  setTimeout(()=>{gameLoop();},1400*S.speed);
});
renderMap();
camTo(0,0); fullView=true; // タイトル裏では全体図
window.DENTYA={get state(){return S;},G,CITIES}; // デバッグ用
document.getElementById("viewbtn").setAttribute("aria-pressed","true");
</script>
