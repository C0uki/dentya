<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デン鉄 -DENTYA- 日本一周すごろく</title>
<style>
:root{
  --sea:#8FCFE3; --sea-deep:#6FB9D6; --land:#F4ECD6; --ink:#2A2E3A;
  --panel:#FFFDF6; --paper:#FFF8E8; --accent:#D94F3D; --gold:#F2B33D;
  --green:#2E9E63; --blue:#3E7BC0; --purple:#8E5AC8; --line:#5A5F6E;
  --shadow:0 4px 14px rgba(42,46,58,.22);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
  color:var(--ink); background:var(--sea); overflow:hidden;
  font-variant-numeric:tabular-nums;
}
button{font-family:inherit; cursor:pointer; border:none; color:inherit;}
button:focus-visible{outline:3px solid var(--blue); outline-offset:2px;}
#app{display:grid; grid-template-columns:1fr 268px; height:100dvh;}
@media (max-width:820px){
  #app{grid-template-columns:1fr; grid-template-rows:62% 38%;}
}
/* ---------- map ---------- */
#mapwrap{position:relative; overflow:hidden; background:
  radial-gradient(1200px 900px at 30% 20%, #A9DCEC 0%, var(--sea) 55%, var(--sea-deep) 100%);}
#map{width:100%; height:100%; display:block;}
.edge{stroke:var(--line); stroke-width:3.4; fill:none; opacity:.75;}
.edge.sea{stroke-dasharray:2 7; stroke-linecap:round; stroke:#3F7E9C; opacity:.8;}
.landblob{stroke:var(--land); fill:var(--land); stroke-linejoin:round; stroke-linecap:round; opacity:.96;}
.sq{stroke:#fff; stroke-width:2.4;}
.sq.blue{fill:var(--blue);} .sq.red{fill:var(--accent);} .sq.card{fill:var(--gold);}
.sq.lotto{fill:var(--purple);} .sq.warp{fill:#25AFA5;}
.sqlabel{fill:#fff; font-size:10px; font-weight:800; text-anchor:middle; pointer-events:none;}
.citypill{fill:var(--panel); stroke:var(--ink); stroke-width:2; rx:6;}
.cityname{font-size:12.5px; font-weight:800; text-anchor:middle; fill:var(--ink); pointer-events:none;}
.citytick{fill:var(--ink);}
.owndot{stroke:#fff; stroke-width:1;}
.opt-hit{fill:transparent; cursor:pointer;}
.opt-ring{fill:none; stroke:#fff; stroke-width:3; pointer-events:none; animation:pulse 1s infinite;}
.dest-ring{fill:none; stroke:var(--accent); stroke-width:4; animation:pulse 1.4s infinite; pointer-events:none;}
.dest-flag{font-size:13px; font-weight:800; fill:var(--accent); text-anchor:middle; pointer-events:none;}
@keyframes pulse{0%{opacity:1; stroke-width:4;}50%{opacity:.35; stroke-width:7;}100%{opacity:1; stroke-width:4;}}
@media (prefers-reduced-motion:reduce){ .opt-ring,.dest-ring{animation:none;} }
.token{stroke:#fff; stroke-width:2.4; filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));}
.tokentxt{fill:#fff; font-size:11px; font-weight:800; text-anchor:middle; pointer-events:none;}
.bonbadge{fill:#4A3070; stroke:#fff; stroke-width:1.6;}
.bonbadgetxt{fill:#fff; font-size:10px; font-weight:800; text-anchor:middle; pointer-events:none;}
/* ---------- HUD ---------- */
#hud{position:absolute; top:10px; left:10px; right:10px; display:flex; gap:8px; align-items:flex-start; pointer-events:none; flex-wrap:wrap;}
.hudcard{background:var(--panel); border:2px solid var(--ink); border-radius:10px; padding:7px 12px; box-shadow:var(--shadow); pointer-events:auto;}
#huddate{font-weight:800; font-size:17px; letter-spacing:.04em;}
#huddest{font-weight:800;}
#huddest .to{color:var(--accent);}
#huddest small{display:block; font-weight:700; color:#6b6f7c; font-size:11px;}
#hudbtns{margin-left:auto; display:flex; gap:6px;}
.hudbtn{background:var(--ink); color:#fff; border-radius:8px; padding:7px 12px; font-weight:800; font-size:13px; box-shadow:var(--shadow);}
.hudbtn[aria-pressed="true"]{background:var(--blue);}
#banner{position:absolute; top:66px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
  padding:8px 22px; border-radius:999px; font-weight:800; font-size:15px; letter-spacing:.06em;
  box-shadow:var(--shadow); opacity:0; transition:opacity .25s; pointer-events:none; max-width:88%; text-align:center; z-index:5;}
#banner.show{opacity:1;}
#banner.warn{background:var(--accent);}
#banner.good{background:var(--green);}
/* ---------- dock ---------- */
#dock{position:absolute; left:10px; right:10px; bottom:10px; display:flex; gap:10px; align-items:flex-end; pointer-events:none;}
#dockmain{background:var(--panel); border:2.5px solid var(--ink); border-radius:14px; padding:10px 14px;
  display:flex; gap:14px; align-items:center; box-shadow:var(--shadow); pointer-events:auto; flex-wrap:wrap; max-width:100%;}
#whoami{display:flex; flex-direction:column; gap:2px; min-width:120px;}
#whoname{font-weight:800; font-size:15px; display:flex; align-items:center; gap:6px;}
.chipdot{width:13px; height:13px; border-radius:50%; display:inline-block; border:2px solid #fff; box-shadow:0 0 0 1.5px var(--ink);}
#whocash{font-weight:800; font-size:14px;}
#whocash.minus{color:var(--accent);}
#dicebtn{background:var(--accent); color:#fff; font-size:17px; font-weight:800; border-radius:12px; padding:13px 26px;
  letter-spacing:.1em; box-shadow:0 4px 0 #A33327; transition:transform .06s;}
#dicebtn:active{transform:translateY(3px); box-shadow:0 1px 0 #A33327;}
#dicebtn:disabled{background:#B9BDC7; box-shadow:0 4px 0 #8f939d; cursor:default;}
#diceview{display:flex; gap:6px; min-height:44px; align-items:center;}
.die{width:42px; height:42px; background:#fff; border:2.5px solid var(--ink); border-radius:9px;
  display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800;}
#hand{display:flex; gap:6px; flex-wrap:wrap; max-width:430px;}
.cardchip{background:var(--paper); border:2px solid var(--gold); border-radius:8px; padding:5px 9px;
  font-size:12px; font-weight:800; line-height:1.25; text-align:left;}
.cardchip small{display:block; font-weight:700; color:#7a6c45; font-size:10px;}
.cardchip.passive{border-color:#9aa; opacity:.85; cursor:default;}
.cardchip:not(.passive):hover{background:#FFEFC2;}
#assetsbtn{background:var(--green); color:#fff; border-radius:8px; padding:8px 12px; font-weight:800; font-size:13px;}
/* ---------- side ---------- */
#side{background:var(--paper); border-left:3px solid var(--ink); display:flex; flex-direction:column; min-height:0;}
@media (max-width:820px){ #side{border-left:none; border-top:3px solid var(--ink);} }
#side h2{font-size:12px; letter-spacing:.22em; padding:9px 12px 5px; color:#7a6c45;}
#ranking{padding:0 8px 8px; display:flex; flex-direction:column; gap:5px;}
.prow{background:var(--panel); border:2px solid var(--ink); border-radius:9px; padding:6px 9px; display:grid;
  grid-template-columns:auto 1fr auto; gap:2px 8px; align-items:center; font-size:12px;}
.prow.active{outline:3px solid var(--gold);}
.prow .rk{font-weight:800; font-size:15px; grid-row:span 2;}
.prow .nm{font-weight:800; font-size:13px; display:flex; gap:5px; align-items:center;}
.prow .total{font-weight:800; grid-row:span 2; text-align:right;}
.prow .sub{color:#6b6f7c; font-size:11px; font-weight:700;}
.bontag{background:#4A3070; color:#fff; border-radius:5px; font-size:10px; padding:1px 5px; font-weight:800;}
.bontag.king{background:#1c1030; border:1px solid var(--gold); color:var(--gold);}
#log{flex:1; overflow-y:auto; padding:4px 12px 12px; font-size:12px; line-height:1.55; border-top:2px dashed #cfc4a4;}
#log p{margin:0 0 3px; font-weight:600;}
#log p.money{color:#7a6c00;} #log p.bad{color:var(--accent);} #log p.sys{color:#6b6f7c;}
/* ---------- modal ---------- */
#overlay{position:fixed; inset:0; background:rgba(30,34,46,.55); display:none; align-items:center; justify-content:center; z-index:50; padding:16px;}
#overlay.show{display:flex;}
.modal{background:var(--panel); border:3px solid var(--ink); border-radius:16px; max-width:560px; width:100%;
  max-height:86dvh; overflow-y:auto; box-shadow:0 12px 40px rgba(0,0,0,.4);}
.modal header{padding:13px 18px 9px; font-weight:800; font-size:18px; letter-spacing:.05em; border-bottom:2px dashed #cfc4a4;}
.modal header.evil{background:#33254d; color:#fff; border-radius:12px 12px 0 0; border-bottom-color:#33254d;}
.modal header.gold{background:var(--gold); border-radius:12px 12px 0 0; border-bottom-color:var(--gold);}
.modal .body{padding:14px 18px; font-size:14px; line-height:1.7;}
.modal .btns{display:flex; gap:8px; padding:0 18px 16px; flex-wrap:wrap; justify-content:flex-end;}
.mbtn{background:var(--ink); color:#fff; font-weight:800; border-radius:9px; padding:10px 20px; font-size:14px;}
.mbtn.primary{background:var(--accent);}
.mbtn.buy{background:var(--green); padding:6px 14px; font-size:13px;}
.mbtn:disabled{background:#B9BDC7; cursor:default;}
table.props{width:100%; border-collapse:collapse; font-size:13px;}
table.props th{font-size:11px; color:#6b6f7c; text-align:left; padding:3px 6px; letter-spacing:.08em;}
table.props td{padding:5px 6px; border-top:1.5px dashed #ddd2b2; font-weight:700;}
table.props td.num{text-align:right;}
.ownedby{font-size:11px; border-radius:5px; padding:1px 6px; color:#fff; font-weight:800; white-space:nowrap;}
.bignum{font-size:26px; font-weight:800; letter-spacing:.03em;}
.bignum.gold{color:#B07E12;} .bignum.bad{color:var(--accent);}
/* ---------- start / finale ---------- */
#startscr{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg,#7FC4DE 0%, #8FCFE3 45%, #F4ECD6 46%, #EFE3C4 100%); padding:16px; overflow:auto;}
#startbox{max-width:520px; width:100%; text-align:center;}
#titlemark{display:inline-block; background:var(--panel); border:3.5px solid var(--ink); border-radius:18px;
  padding:22px 34px 18px; box-shadow:var(--shadow); position:relative;}
#titlemark::before{content:""; position:absolute; left:14px; right:14px; top:10px; height:7px; border-radius:99px;
  background:repeating-linear-gradient(90deg, var(--accent) 0 22px, var(--panel) 22px 30px);}
#titlemark h1{font-size:clamp(38px,9vw,58px); font-weight:800; letter-spacing:.14em; margin-top:12px; text-wrap:balance;}
#titlemark h1 span{color:var(--accent);}
#titlemark .sub{font-weight:800; letter-spacing:.42em; font-size:12px; color:#6b6f7c; margin-top:4px;}
#startform{margin-top:20px; background:var(--panel); border:3px solid var(--ink); border-radius:14px; padding:16px 20px;
  text-align:left; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px;}
#startform label{font-weight:800; font-size:13px; display:flex; align-items:center; gap:10px; justify-content:space-between;}
#startform select,#startform input{font-family:inherit; font-size:14px; font-weight:800; padding:7px 10px;
  border:2px solid var(--ink); border-radius:8px; background:#fff; color:var(--ink);}
#startform input{width:11em;}
#startbtn{background:var(--accent); color:#fff; font-size:19px; font-weight:800; letter-spacing:.18em;
  border-radius:12px; padding:14px; box-shadow:0 5px 0 #A33327;}
#startbtn:active{transform:translateY(3px); box-shadow:0 2px 0 #A33327;}
.rulenote{font-size:12px; font-weight:700; color:#6b6f7c; line-height:1.7;}
.finrow{display:grid; grid-template-columns:44px 1fr auto; gap:10px; align-items:center; background:var(--paper);
  border:2px solid var(--ink); border-radius:10px; padding:9px 13px; margin-bottom:7px; opacity:0; transform:translateY(8px);
  transition:opacity .4s, transform .4s;}
.finrow.reveal{opacity:1; transform:none;}
.finrow .frk{font-size:21px; font-weight:800;}
.finrow.first{background:#FFF0BF; border-color:#B07E12;}
.finrow .fnm{font-weight:800; display:flex; gap:7px; align-items:center;}
.finrow .fassets{font-weight:800; text-align:right;}
.finrow .fsub{font-size:11px; color:#6b6f7c; font-weight:700;}
</style>
</head>

      <div id="dockmain">

        <div id="diceview"></div>
        <div id="hand"></div>
        <button id="assetsbtn">資産</button>
      </div>

  </div>
</div>
<div id="overlay"></div>
<div id="startscr">
  <div id="startbox">
    <div id="titlemark">
      <h1>デン<span>鉄</span></h1>
      <div class="sub">DENTYA・日本一周すごろく</div>
    </div>
    <form id="startform">
      <label>プレイヤー名 <input id="pname" value="あなた" maxlength="6"></label>
      <label>あそぶ年数
        <select id="pyears">
          <option value="1">1年(おためし)</option>
          <option value="3" selected>3年</option>
          <option value="5">5年</option>
          <option value="10">10年</option>
        </select>
      </label>

      </label>
      <label>演出スピード
        <select id="pspeed"><option value="1" selected>ふつう</option><option value="0.55">はやい</option><option value="0.3">ばくそく</option></select>
      </label>
      <p class="rulenote">サイコロで進んで目的地を目指せ!駅では物件を買って収益アップ、独占すれば収益2倍。毎年3月に決算。目的地にビリだと貧乏神が…!最後に総資産がいちばん多い人の勝ち。</p>
      <button id="startbtn" type="submit">出発進行!</button>
    </form>
  </div>
</div>

/* ================= graph ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const G={nodes:[],adj:[],cityIdx:{}};
(function buildGraph(){
  const rng=mulberry32(20260703);
  CITIES.forEach((c,i)=>{
    G.cityIdx[c[0]]=G.nodes.length;
    G.nodes.push({type:"city",name:c[0],x:c[1],y:c[2],region:c[3],ci:i});
    G.adj.push([]);
  });
  const link=(a,b)=>{G.adj[a].push(b);G.adj[b].push(a);};
  G.edgeLines=[];
  for(const [an,bn,k,sea] of EDGES){
    const a=G.cityIdx[an], b=G.cityIdx[bn];
    const A=G.nodes[a], B=G.nodes[b];
    let prev=a; const chain=[a];
    for(let j=1;j<=k;j++){
      const t=j/(k+1);
      const nx=A.x+(B.x-A.x)*t, ny=A.y+(B.y-A.y)*t;
      const dx=B.x-A.x, dy=B.y-A.y, len=Math.hypot(dx,dy)||1;
      const off=(rng()-0.5)*22;
      const r=rng();
      const type= r<0.32?"blue" : r<0.56?"red" : r<0.80?"card" : r<0.90?"lotto" : "warp";
      const id=G.nodes.length;
      G.nodes.push({type,x:nx-dy/len*off,y:ny+dx/len*off,sea:!!sea});
      G.adj.push([]);
      link(prev,id); prev=id; chain.push(id);
    }
    link(prev,b); chain.push(b);
    G.edgeLines.push({chain,sea:!!sea});
  }
})();
function distsFrom(src){
  const d=new Array(G.nodes.length).fill(-1); d[src]=0;
  const q=[src];
  for(let h=0;h<q.length;h++){const u=q[h];for(const v of G.adj[u])if(d[v]<0){d[v]=d[u]+1;q.push(v);}}
  return d;
}
const bfsDist=(a,b)=>distsFrom(a)[b];

function fmtMoney(m){ // m は「万」単位
  const neg=m<0; m=Math.round(Math.abs(m));
  const oku=Math.floor(m/10000), man=m%10000;
  let s= oku>0 ? (man>0?`${oku}億${man}万円`:`${oku}億円`) : `${man}万円`;
  return neg?`▲${s}`:s;
}
function propOwners(ci){return CITIES[ci][4].map((_,pi)=>S.propOwner[ci][pi]);}
function isMonopoly(ci,pl){return propOwners(ci).every(o=>o===pl);}
function cityIncome(ci,pl){
  let inc=0; const mono=isMonopoly(ci,pl);
  CITIES[ci][4].forEach((p,pi)=>{ if(S.propOwner[ci][pi]===pl) inc+=p[1]*p[2]/100*(mono?2:1); });
  return Math.round(inc);
}
function playerIncome(pl){let t=0;for(let ci=0;ci<CITIES.length;ci++)t+=cityIncome(ci,pl);return t;}
function propValue(pl){let t=0;for(let ci=0;ci<CITIES.length;ci++)CITIES[ci][4].forEach((p,pi)=>{if(S.propOwner[ci][pi]===pl)t+=p[1];});return t;}

let AC=null, muted=false;
function ac(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); } return AC; }
function tone(freq,dur,type="square",vol=0.08,when=0){
  if(muted) return;
  try{
    const c=ac(), o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,c.currentTime+when);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+when+dur);
    o.connect(g).connect(c.destination);
    o.start(c.currentTime+when); o.stop(c.currentTime+when+dur+0.02);
  }catch(e){}
}

/* ================= game flow ================= */
function newDest(exclude){
  const cands=[];
  for(const name in G.cityIdx){
    const id=G.cityIdx[name];
    if(id!==exclude&&bfsDist(exclude,id)>=5)cands.push(id);
  }
  S.dest=pick(cands.length?cands:Object.values(G.cityIdx).filter(i=>i!==exclude));
  drawDest();
}
async function showDice(rolls){
  const dv=$("diceview"); dv.innerHTML="";
  const dies=rolls.map(()=>{const d=document.createElement("div");d.className="die";d.textContent="?";dv.appendChild(d);return d;});
  SND.dice();
  for(let f=0;f<7;f++){dies.forEach(d=>d.textContent=1+rnd(6));await sleep(55);}
  dies.forEach((d,i)=>d.textContent=rolls[i]);
  await sleep(450);
}
function chooseCpuStep(p,opts,target){
  const dt=distsFrom(target);
  let best=opts[0],bd=Infinity;
  for(const o of opts){ if(dt[o]>=0&&dt[o]<bd){bd=dt[o];best=o;} }
  return best;
}
async function chooseHumanStep(p,opts){
  banner("すすむ方向をえらんでね","",true);
  return new Promise(res=>{
    const marks=[];
    opts.forEach(o=>{
      const n=G.nodes[o];
      const ring=el("circle",{cx:n.x,cy:n.y,r:17,class:"opt-ring"},gOpt);
      const hit=el("circle",{cx:n.x,cy:n.y,r:26,class:"opt-hit"},gOpt);
      hit.addEventListener("click",()=>{
        marks.forEach(m=>m.remove());
        $("banner").classList.remove("show");
        res(o);
      });
      marks.push(ring,hit);
    });
  });
}
async function moveBy(p,steps){
  const target= S.bonbi.holder===p.i ? nearestOther(p) : S.dest;
  for(let s=0;s<steps;s++){
    let opts=G.adj[p.pos].filter(n=>n!==p.prev);
    if(!opts.length)opts=[p.prev];
    let next;
    if(opts.length===1)next=opts[0];
    else next= p.human? await chooseHumanStep(p,opts) : chooseCpuStep(p,opts,target);
    p.prev=p.pos; p.pos=next;
    SND.tick(); drawTokens(); focusPlayer(p);
    await sleep(230);
    if(next===S.dest){ await arrive(p); return; }
  }
  await landEffect(p);
}
function nearestOther(p){
  const d=distsFrom(p.pos);
  let best=-1,bd=Infinity;
  for(const q of S.players)if(q.i!==p.i&&d[q.pos]>=0&&d[q.pos]<bd){bd=d[q.pos];best=q.pos;}
  return best<0?S.dest:best;
}
function gainMoney(p,amt,msg,kind){
  p.cash+=amt;
  log(`${p.name}:${msg} ${amt>=0?"+":""}${fmtMoney(amt)}`,amt>=0?"money":"bad");
  (amt>=0?SND.coin:SND.bad)();
  banner(`${msg} ${amt>=0?"+":""}${fmtMoney(amt)}`,amt>=0?"good":"warn");
}
function giveCard(p,cid){
  if(p.cards.length>=HAND_MAX){log(`${p.name}:カードがいっぱいで もらえなかった…`,"sys");return false;}
  p.cards.push(cid);
  SND.card();
  log(`${p.name}:${CARDS[cid].n}を手に入れた!`);
  banner(`${CARDS[cid].n}を手に入れた!`);
  return true;
}
function randomCard(){
  const total=Object.values(CARDS).reduce((s,c)=>s+c.w,0);
  let r=Math.random()*total;
  for(const id in CARDS){r-=CARDS[id].w;if(r<=0)return id;}
  return "kyuko";
}
async function landEffect(p){
  const n=G.nodes[p.pos];
  await sleep(150);
  if(n.type==="city"){ await cityStop(p,n); return; }
  if(n.type==="blue"){ gainMoney(p,Math.round((80+rnd(280))*yearMult()),"プラス駅!臨時収入"); }
  else if(n.type==="red"){ gainMoney(p,-Math.round((80+rnd(280))*yearMult()),"マイナス駅…出費だ"); }
  else if(n.type==="card"){ giveCard(p,randomCard()); }
  else if(n.type==="lotto"){
    const r=Math.random();
    let amt=0,label="はずれ…";
    if(r>0.99){amt=10000;label="超大当たり!!1等!";}
    else if(r>0.95){amt=3000;label="大当たり!2等!";}
    else if(r>0.85){amt=1000;label="当たり!3等!";}
    else if(r>0.65){amt=400;label="小当たり!";}
    log(`${p.name}:宝くじ駅で抽選…${label}`);
    if(amt>0){await sleep(300);gainMoney(p,Math.round(amt*yearMult()),`宝くじ ${label}`);}
    else {banner("宝くじ…はずれ","warn");SND.bad();}
  }
  else if(n.type==="warp"){
    banner("ワープ駅!どこかへ飛ばされる!","warn");
    SND.card();
    await sleep(600);
    const cid=pick(Object.values(G.cityIdx).filter(i=>i!==S.dest&&i!==p.pos));
    p.pos=cid;p.prev=-1;
    drawTokens();focusPlayer(p);
    log(`${p.name}:ワープ駅で${G.nodes[cid].name}へ飛ばされた!`);
    await sleep(400);
    await cityStop(p,G.nodes[cid]);
  }
  updateAll();
}
async function cityStop(p,n){
  const ci=n.ci;
  const buyable=CITIES[ci][4].map((pr,pi)=>({pr,pi})).filter(x=>S.propOwner[ci][x.pi]<0);
  if(!buyable.length){log(`${p.name}:${n.name}に停車(売り物件なし)`,"sys");return;}
  if(p.human){ await buyDialog(p,ci); }
  else{
    let bought=[];
    const sorted=[...buyable].sort((a,b)=>a.pr[1]-b.pr[1]);
    for(const {pr,pi} of sorted){
      const wantMono=propOwners(ci).filter(o=>o===p.i).length===CITIES[ci][4].length-1;
      const reserve=wantMono?0:300;
      if(p.cash-pr[1]>=reserve){ p.cash-=pr[1]; S.propOwner[ci][pi]=p.i; bought.push(pr[0]); }
    }
    if(bought.length){
      SND.coin();
      log(`${p.name}:${n.name}で ${bought.join("、")} を購入!`);
      banner(`${p.name}が${n.name}で物件を購入!`);
      if(isMonopoly(ci,p.i)){log(`${p.name}:${n.name}を独占!収益2倍!!`,"money");banner(`${p.name}が${n.name}を独占!!`,"warn");SND.fanfare();}
      await sleep(600);
    }
  }
  updateAll();
}
async function buyDialog(p,ci){
  while(true){
    const props=CITIES[ci][4];
    let rows=props.map((pr,pi)=>{
      const o=S.propOwner[ci][pi];
      const can=o<0&&p.cash>=pr[1];
      return `<tr><td>${pr[0]}</td><td class="num">${fmtMoney(pr[1])}</td><td class="num">${pr[2]}%</td>
        <td>${o<0?`<button class="mbtn buy" data-pi="${pi}" ${can?"":"disabled"}>買う</button>`:ownerTag(o)}</td></tr>`;
    }).join("");
    const choice=await new Promise(res=>{
      const ov=$("overlay");
      ov.innerHTML="";
      const m=document.createElement("div"); m.className="modal";
      m.innerHTML=`<header class="gold">${CITIES[ci][0]}駅 物件案内</header>
        <div class="body"><p>持ち金:<b>${fmtMoney(p.cash)}</b> ${isMonopoly(ci,p.i)?'<b style="color:#B07E12">★この街を独占中!</b>':""}</p>
        <table class="props"><tr><th>物件</th><th style="text-align:right">価格</th><th style="text-align:right">収益率</th><th></th></tr>${rows}</table></div>
        <div class="btns"><button class="mbtn" id="buyclose">やめる</button></div>`;
      m.querySelectorAll(".buy").forEach(bt=>bt.onclick=()=>{ov.classList.remove("show");ov.innerHTML="";res(+bt.dataset.pi);});
      m.querySelector("#buyclose").onclick=()=>{ov.classList.remove("show");ov.innerHTML="";res(-1);};
      ov.appendChild(m); ov.classList.add("show");
    });
    if(choice<0)break;
    const pr=CITIES[ci][4][choice];
    p.cash-=pr[1]; S.propOwner[ci][choice]=p.i;
    SND.coin();
    log(`${p.name}:${CITIES[ci][0]}の${pr[0]}を購入!(${fmtMoney(pr[1])})`,"money");
    if(isMonopoly(ci,p.i)){
      SND.fanfare();
      log(`${p.name}:${CITIES[ci][0]}を独占!収益2倍!!`,"money");
      await modal({title:"独占!!",headKlass:"gold",html:`<p class="bignum gold">${CITIES[ci][0]}を独占!</p><p>この街の物件収益が<b>2倍</b>になった!</p>`});
    }
    updateAll();
  }
}
async function arrive(p){
  drawTokens();
  const prize=currentPrize();
  p.cash+=prize; S.arrivals++;
  SND.fanfare();
  log(`${p.name}:目的地 ${G.nodes[S.dest].name} に一番乗り!賞金${fmtMoney(prize)}!`,"money");
  await modal({title:"目的地とうちゃく!",headKlass:"gold",
    html:`<p><b>${p.name}</b>が <b>${G.nodes[S.dest].name}</b> に一番乗り!</p><p class="bignum gold">賞金 ${fmtMoney(prize)}</p>`});
  const old=S.dest;
  newDest(old);
  // 貧乏神:新目的地からいちばん遠いプレイヤーに憑依
  const others=S.players.filter(q=>q.i!==p.i);
  if(others.length){
    const d=distsFrom(old);
    let far=others[0];
    for(const q of others)if(d[q.pos]>d[far.pos])far=q;
    await attachBonbi(far);
  }
  banner(`つぎの目的地は ${G.nodes[S.dest].name}!`,"good");
  log(`つぎの目的地は ${G.nodes[S.dest].name} にきまった!`,"sys");
  const dn=G.nodes[S.dest];
  camTo(dn.x,dn.y,500);
  await sleep(900);
  updateAll();
}
async function attachBonbi(q){
  const shieldIdx=q.cards.indexOf("shield");
  if(shieldIdx>=0){
    q.cards.splice(shieldIdx,1);
    log(`${q.name}:シールドカードが貧乏神をはじいた!`,"money");
    banner(`${q.name}のシールドが貧乏神をブロック!`,"good");
    SND.card();
    return;
  }
  S.bonbi={holder:q.i,king:false,turns:0};
  SND.bonbi();
  await modal({title:"貧乏神があらわれた!",headKlass:"evil",
    html:`<p>ビリだった <b>${q.name}</b> に<br><b style="font-size:20px">貧乏神</b>がとりついた…!</p><p>毎ターンわるさをするぞ。だれかに なすりつけろ!</p>`});
  log(`${q.name}に貧乏神がとりついた…!`,"bad");
  updateAll();
}
async function bonbiPhase(p){
  const B=S.bonbi;
  if(B.holder<0)return;
  const holder=S.players[B.holder];
  // なすりつけ(同じマスにいる相手へ)
  if(p.i!==B.holder&&p.pos===holder.pos){ await transferBonbi(p); return; }
  if(p.i===B.holder){
    const targets=S.players.filter(q=>q.i!==p.i&&q.pos===p.pos);
    if(targets.length){ await transferBonbi(pick(targets)); return; }
    await mischief(p);
  }
}
async function transferBonbi(to){
  const shieldIdx=to.cards.indexOf("shield");
  if(shieldIdx>=0){
    to.cards.splice(shieldIdx,1);
    log(`${to.name}:シールドカードが貧乏神をはじいた!`,"money");
    banner(`${to.name}のシールドが貧乏神をブロック!`,"good");
    return;
  }
  const from=S.players[S.bonbi.holder];
  S.bonbi.holder=to.i; S.bonbi.turns=0;
  SND.bonbi();
  log(`貧乏神が${from.name}から${to.name}になすりつけられた!`,"bad");
  banner(`貧乏神が${to.name}にのりうつった!`,"warn");
  await sleep(700);
  updateAll();
}
async function mischief(p){
  const B=S.bonbi;
  await sleep(400);
  if(B.king){
    if(Math.random()<0.4){
      // 物件破壊
      const owned=[];
      for(let ci=0;ci<CITIES.length;ci++)CITIES[ci][4].forEach((pr,pi)=>{if(S.propOwner[ci][pi]===p.i)owned.push({ci,pi,pr});});
      if(owned.length){
        const t=pick(owned);
        S.propOwner[t.ci][t.pi]=-1;
        SND.king();
        log(`キングボンビー:${p.name}の「${t.ci>=0?CITIES[t.ci][0]:""}の${t.pr[0]}」を破壊した!!`,"bad");
        await modal({title:"キングボンビーのわるさ",headKlass:"evil",
          html:`<p><b>${CITIES[t.ci][0]}の${t.pr[0]}</b>(${fmtMoney(t.pr[1])})が<br><b style="color:var(--accent)">こなごなに破壊された!!</b></p>`});
      } else {
        const amt=Math.round((1200+rnd(2800))*yearMult());
        gainMoney(p,-amt,"キングボンビーがお金をばらまいた!!");
      }
    }else{
      const amt=Math.round((1200+rnd(2800))*yearMult());
      SND.king();
      gainMoney(p,-amt,"キングボンビーの豪遊!!");
    }
  }else{
    const r=Math.random();
    if(r<0.2&&p.cards.length){
      const idx=rnd(p.cards.length);
      const cid=p.cards.splice(idx,1)[0];
      SND.bad();
      log(`貧乏神:${p.name}の${CARDS[cid].n}を線路に捨てた…`,"bad");
      banner(`貧乏神が${CARDS[cid].n}を捨てた…`,"warn");
    }else if(r<0.85){
      const amt=Math.round((100+rnd(450))*yearMult());
      gainMoney(p,-amt,"貧乏神のむだづかい…");
    }else{
      log(`貧乏神:きょうは ひるねをしている…`,"sys");
      banner("貧乏神はひるね中…","");
    }
  }
  B.turns++;
  if(!B.king&&B.turns>=2&&Math.random()<0.18){
    B.king=true;
    SND.king();
    await modal({title:"!!!!",headKlass:"evil",
      html:`<p style="text-align:center" class="bignum bad">キングボンビー誕生!!</p><p>貧乏神が変身した!わるさが超凶悪になるぞ…!<br>いそいで だれかに なすりつけろ!!</p>`});
    log("貧乏神がキングボンビーに変身した!!","bad");
  }
  updateAll();
}
/* ---------- cards ---------- */
async function useCard(p,idx){
  const cid=p.cards[idx], c=CARDS[cid];
  if(c.kind==="move"){ p.cards.splice(idx,1); log(`${p.name}:${c.n}を使った!`); banner(`${c.n}!`); SND.card(); return {dice:c.dice}; }
  if(c.kind==="warp"){
    p.cards.splice(idx,1);
    SND.card();
    log(`${p.name}:ぶっとびカードを使った!`);
    banner("ぶっとび〜〜!","warn");
    await sleep(600);
    const cid2=pick(Object.values(G.cityIdx).filter(i=>i!==p.pos));
    p.pos=cid2;p.prev=-1;
    drawTokens();focusPlayer(p);
    await sleep(500);
    if(cid2===S.dest){await arrive(p);}else{await cityStop(p,G.nodes[cid2]);}
    return {done:true};
  }
  if(c.kind==="money"){
    p.cards.splice(idx,1);
    gainMoney(p,Math.round((200+rnd(600))*yearMult()),"福袋カード!");
    return null;
  }
  if(c.kind==="ohara"){
    if(S.bonbi.holder!==p.i){banner("貧乏神がついていないと使えないよ","warn");return null;}
    p.cards.splice(idx,1);
    S.bonbi.holder=-1;
    SND.fanfare();
    log(`${p.name}:おはらいカードで貧乏神を追いはらった!`,"money");
    await modal({title:"おはらい成功!",headKlass:"gold",html:"<p>貧乏神は とおくへ 飛んでいった…!</p>"});
    updateAll();
    return null;
  }
  if(c.kind==="throw"){
    if(S.bonbi.holder!==p.i){banner("貧乏神がついていないと使えないよ","warn");return null;}
    p.cards.splice(idx,1);
    const t=pick(S.players.filter(q=>q.i!==p.i));
    log(`${p.name}:豪速球カード!貧乏神をぶん投げた!`);
    banner("豪速球〜〜!!","warn");
    SND.card();
    await sleep(700);
    await transferBonbi(t);
    return null;
  }
  return null;
}
function cpuPreRoll(p){
  // 貧乏神対応
  if(S.bonbi.holder===p.i){
    let i=p.cards.indexOf("ohara"); if(i>=0)return {card:i};
    i=p.cards.indexOf("gosoku"); if(i>=0)return {card:i};
  }
  const d=bfsDist(p.pos,S.dest);
  const tryCards=["nozomi","tokkyu","kyuko"];
  if(d>=7&&Math.random()<0.6){
    for(const cid of tryCards){const i=p.cards.indexOf(cid);if(i>=0)return {card:i};}
  }
  const f=p.cards.indexOf("fuku");
  if(f>=0&&Math.random()<0.5)return {card:f};
  return {roll:true};
}
/* ---------- turn ---------- */
async function doTurn(p){
  updateAll(); focusPlayer(p);
  banner(`${p.name}のばん!`,"");
  await sleep(500);
  let diceCount=1, done=false;
  if(p.human){
    $("dicebtn").disabled=false;
    while(true){
      const a=await waitAction();
      if(a.kind==="roll"){diceCount=1;break;}
      const res=await useCard(p,a.idx);
      updateAll();
      if(res&&res.done){done=true;break;}
      if(res&&res.dice){diceCount=res.dice;break;}
      $("dicebtn").disabled=false;
    }
    $("dicebtn").disabled=true;
  }else{
    await sleep(400);
    let guard=0;
    while(guard++<4){
      const act=cpuPreRoll(p);
      if(act.roll){diceCount=1;break;}
      const res=await useCard(p,act.card);
      updateAll();
      if(res&&res.done){done=true;break;}
      if(res&&res.dice){diceCount=res.dice;break;}
    }
  }
  if(!done){
    const rolls=Array.from({length:diceCount},()=>1+rnd(6));
    await showDice(rolls);
    const total=rolls.reduce((a,b)=>a+b,0);
    log(`${p.name}:サイコロは ${rolls.join("・")} → ${total}マス進む`,"sys");
    await moveBy(p,total);
  }
  $("diceview").innerHTML="";
  await bonbiPhase(p);
  updateAll();
  await sleep(350);
}
async function settlement(){
  SND.fanfare();
  let rows="";
  for(const p of S.players){
    const inc=playerIncome(p.i);
    let interest=0;
    if(p.cash<0){interest=Math.round(p.cash*0.1);}
    p.cash+=inc+interest;
    rows+=`<tr><td><span class="chipdot" style="background:${p.color}"></span> ${p.name}</td>
      <td class="num" style="color:#2E7D4F">+${fmtMoney(inc)}</td>
      <td class="num" style="color:var(--accent)">${interest?fmtMoney(interest):"—"}</td>
      <td class="num"><b>${fmtMoney(p.cash)}</b></td></tr>`;
    log(`決算:${p.name} 収益+${fmtMoney(inc)}${interest?` 借金利子${fmtMoney(interest)}`:""}`,"money");
  }
  await modal({title:`${yearOf()}年目 3月 けっさん!`,headKlass:"gold",
    html:`<table class="props"><tr><th>プレイヤー</th><th style="text-align:right">物件収益</th><th style="text-align:right">借金利子</th><th style="text-align:right">持ち金</th></tr>${rows}</table>
    <p style="margin-top:8px" class="rulenote">物件の収益は 価格×収益率。独占した街は2倍!持ち金がマイナスだと利子10%がのしかかる…</p>`});
  updateAll();
}
async function finale(){
  S.over=true;
  SND.win();
  const list=[...S.players].sort((a,b)=>totalAssets(b)-totalAssets(a));
  const ov=$("overlay");
  ov.innerHTML="";
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<header class="gold">結果はっぴょう!(${S.years}年の旅)</header><div class="body" id="finbody"></div>
    <div class="btns"><button class="mbtn primary" id="againbtn">もういちど遊ぶ</button></div>`;
  ov.appendChild(m); ov.classList.add("show");
  const body=m.querySelector("#finbody");
  const rows=list.map((p,i)=>{
    const r=document.createElement("div");
    r.className="finrow"+(i===0?" first":"");
    r.innerHTML=`<div class="frk">${i+1}位</div>
      <div><div class="fnm"><span class="chipdot" style="background:${p.color}"></span>${p.name}${p.human?"":" (CPU)"}</div>
      <div class="fsub">持ち金 ${fmtMoney(p.cash)} ・ 物件 ${fmtMoney(propValue(p.i))}</div></div>
      <div class="fassets">${fmtMoney(totalAssets(p))}</div>`;
    body.appendChild(r);
    return r;
  });
  m.querySelector("#againbtn").onclick=()=>location.reload();
  for(let i=rows.length-1;i>=0;i--){
    await sleep(800);
    rows[i].classList.add("reveal");
    if(i===0)SND.fanfare();else SND.tick();
  }
  const winner=list[0];
  log(`ゲーム終了!優勝は ${winner.name}(総資産 ${fmtMoney(totalAssets(winner))})!`,"money");
}
async function gameLoop(){
  while(!S.over){
    const p=S.players[S.turn];
    await doTurn(p);
    if(S.over)break;
    S.turn=(S.turn+1)%S.players.length;
    if(S.turn===0){
      const isMarch=S.monthIdx%12===11;
      if(isMarch){
        await settlement();
        if(S.monthIdx===S.years*12-1){await finale();return;}
      }
      S.monthIdx++;
    }
    updateAll();
  }
}
/* ---------- start ---------- */
document.getElementById("startform").addEventListener("submit",e=>{
  e.preventDefault();
  ac(); // ユーザー操作でAudioContext解放
  const name=($("pname").value.trim()||"あなた").slice(0,6);
  S.years=+$("pyears").value;
  S.speed=+$("pspeed").value;
  const ncpu=+$("pcpus").value;
  S.propOwner=CITIES.map(c=>c[4].map(()=>-1));
  const start=G.cityIdx["東京"];
  S.players=[{i:0,name,human:true,color:PCOLORS[0],cash:1000,cards:["kyuko"],pos:start,prev:-1}];
  for(let k=0;k<ncpu;k++)
    S.players.push({i:k+1,name:CPU_NAMES[k],human:false,color:PCOLORS[k+1],cash:1000,cards:["kyuko"],pos:start,prev:-1});
  newDest(start);
  $("startscr").style.display="none";
  renderMap(); updateAll();
  log(`日本一周すごろく、スタート!${S.years}年の旅がはじまる!`,"sys");
  log(`さいしょの目的地は ${G.nodes[S.dest].name}!`,"sys");
  banner(`目的地は ${G.nodes[S.dest].name}!しゅっぱつ!!`,"good");
  const dn=G.nodes[S.dest];
  camTo(dn.x,dn.y,600);
  setTimeout(()=>{gameLoop();},1400*S.speed);
});
renderMap();
camTo(0,0); fullView=true; // タイトル裏では全体図
document.getElementById("viewbtn").setAttribute("aria-pressed","true");
